<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Management operațional | Construiește-ți fabrica</title>
<meta name="theme-color" content="#0FA3A3">
<meta name="description" content="Exerciții, studii de caz și grile pentru cursul de Management operațional, anul III, ASE București.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏭</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>:root{
  --bg:#EEF5F9;--card:#FFFFFF;--ink:#1D2B3A;--muted:#5E7085;--line:#D8E3EC;
  --teal:#0FA3A3;--teal-d:#0A7F80;--yellow:#FFC93C;--yellow-d:#D9A200;--coral:#FF6B5B;--coral-d:#D94A3B;--violet:#7C5CFF;
  --green:#1FA971;--green-d:#168055;--green-bg:#E2F6EC;--coral-bg:#FFE8E4;--amber-bg:#FFF3D3;--amber:#B07A00;
  --r:18px;
  font-family:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0F1821;--card:#182431;--ink:#E8EFF6;--muted:#9BACBE;--line:#2A3A4A;
  --teal:#2CC4C2;--teal-d:#18908F;--green:#3ACB8C;--green-d:#22955F;--green-bg:#123527;--coral-bg:#3D1C19;--amber-bg:#3A2D0E;--amber:#FFC93C;}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font-size:17px;line-height:1.5;font-weight:600;font-variant-numeric:tabular-nums;overflow-x:hidden}
#app{max-width:640px;margin:0 auto;padding:0 16px 40px;min-height:100dvh}
#app.v-card{display:flex;flex-direction:column;padding-bottom:0}
#app.v-card .cta,#app.v-card .sheet{margin-top:auto}
#app.v-card .card{margin-bottom:16px}
a{color:var(--teal-d)}
:focus-visible{outline:3px solid var(--violet);outline-offset:2px;border-radius:10px}
h1,h2{font-weight:900;line-height:1.12;margin:0}
.kick{margin:0;color:var(--muted);font-size:.9rem;font-weight:700}
.err{color:var(--coral-d)}

/* ---------- butoane 3D ---------- */
.btn{font:inherit;font-weight:800;font-size:1rem;border:0;border-radius:16px;padding:12px 20px;min-height:48px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--teal);color:#fff;box-shadow:0 4px 0 var(--teal-d);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--teal-d)}
.btn:disabled{background:var(--line);color:var(--muted);box-shadow:0 4px 0 color-mix(in srgb,var(--line) 70%,#000);cursor:not-allowed;transform:none}
.btn.big{font-size:1.08rem;padding:14px 24px;min-height:54px}
.btn.full{width:100%}
.btn.ghost{background:var(--card);color:var(--teal-d);box-shadow:0 0 0 2px var(--line) inset,0 4px 0 var(--line)}
.btn.ghost:active{box-shadow:0 0 0 2px var(--line) inset,0 1px 0 var(--line)}
.btn.danger{color:var(--coral-d)}
.link{background:none;border:0;color:var(--teal-d);font:inherit;font-weight:800;padding:10px 0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* ---------- HUD ---------- */
.hud{position:sticky;top:0;z-index:6;margin:0 -16px;padding:10px 16px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px)}
.hrow{display:flex;align-items:center;gap:12px}
.av{width:46px;height:46px;border-radius:14px;background:var(--card);display:grid;place-items:center;font-size:1.6rem;box-shadow:0 3px 0 var(--line)}
.hinfo{flex:1;min-width:0}
.hg{font-weight:900;font-size:1rem}
.xpb{height:10px;border-radius:6px;background:var(--line);overflow:hidden;margin:3px 0}
.xpb i{display:block;height:100%;background:linear-gradient(90deg,var(--violet),#B07CFF);border-radius:6px;transition:width .6s}
.hx{font-size:.78rem;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hstats{display:flex;flex-direction:column;gap:2px;font-weight:900;font-size:.95rem;text-align:right}

/* ---------- intro hartă ---------- */
.intro{padding:18px 4px 4px;text-align:center}
.intro h1{font-size:clamp(2rem,8.4vw,2.8rem);color:var(--ink)}
.intro p{margin:8px auto 0;max-width:34ch;color:var(--muted)}
.intro .pc{display:inline-block;margin-top:12px;padding:6px 14px;border-radius:999px;background:var(--yellow);color:#3A2A00;font-weight:900}

/* ---------- harta ---------- */
.map{position:relative;list-style:none;margin:10px 0 0;padding:10px 0 20px}
.path{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.pbase{fill:none;stroke:color-mix(in srgb,var(--teal) 22%,var(--line));stroke-width:14;stroke-linecap:round}
.pdash{fill:none;stroke:var(--card);stroke-width:3;stroke-dasharray:10 12;stroke-linecap:round;animation:belt 1.6s linear infinite}
@keyframes belt{to{stroke-dashoffset:-44}}
.node{position:relative;display:flex;justify-content:center;margin:4px 0}
.nl{transform:translateX(var(--x));position:relative;display:flex;flex-direction:column;align-items:center;text-decoration:none;color:var(--ink);width:170px}
.nl:active .hall{transform:scale(.95)}
.hall{width:150px;height:auto;display:block;transition:transform .15s;filter:drop-shadow(0 6px 0 rgba(30,50,70,.08))}
.nt{margin-top:-2px;font-size:.88rem;font-weight:800;text-align:center;line-height:1.25;background:var(--card);padding:5px 10px;border-radius:12px;box-shadow:0 3px 0 var(--line)}
.nt b{color:var(--teal-d);margin-right:3px}
.node.next .hall{animation:bob 1.8s ease-in-out infinite}
.here{position:absolute;top:-6px;z-index:2;background:var(--violet);color:#fff;font-size:.78rem;font-weight:900;padding:4px 10px;border-radius:10px;white-space:nowrap}
.here::after{content:"";position:absolute;left:50%;bottom:-5px;margin-left:-5px;border:5px solid transparent;border-bottom:0;border-top-color:var(--violet)}
@keyframes bob{50%{transform:translateY(-6px)}}
.hall .smoke circle{fill:#C9D6E2;opacity:0;animation:smoke 2.6s ease-out infinite}
.hall .smoke circle:nth-child(2){animation-delay:.8s}.hall .smoke circle:nth-child(3){animation-delay:1.6s}
@keyframes smoke{0%{opacity:0;transform:translateY(8px)}30%{opacity:.85}100%{opacity:0;transform:translateY(-10px)}}

/* ---------- insigne ---------- */
.sect{margin-top:30px}
.sect h2,.sect summary{font-size:1.3rem;font-weight:900}
.bgs{list-style:none;padding:0;margin:12px 0 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.bdg{background:var(--card);border-radius:16px;padding:12px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;box-shadow:0 3px 0 var(--line);opacity:.6}
.bdg.has{opacity:1;box-shadow:0 3px 0 var(--yellow-d);outline:2px solid var(--yellow)}
.be{font-size:1.9rem;line-height:1.2}
.bn{font-weight:900;font-size:.9rem}
.bd{font-size:.74rem;color:var(--muted);font-weight:600;line-height:1.3}
.tools{background:var(--card);border-radius:var(--r);padding:6px 16px 14px;box-shadow:0 3px 0 var(--line)}
.tools summary{cursor:pointer;font-size:1.05rem;padding:10px 0;min-height:44px}
.tools p{color:var(--muted);font-weight:600}
.tb{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.foot{margin:28px 0 0;color:var(--muted);font-size:.82rem;font-weight:600;text-align:center}

/* ---------- bara lecției ---------- */
.lt{position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:10px;margin:0 -16px;padding:10px 16px;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(8px)}
.x{width:40px;height:40px;flex:none;display:grid;place-items:center;border-radius:12px;font-size:1.25rem;text-decoration:none;color:var(--muted);font-weight:900}
.segs{flex:1;display:flex;gap:3px;align-items:center}
.seg{flex:1;height:12px;border:0;padding:0;border-radius:6px;background:var(--line);cursor:pointer;min-width:0}
.seg.ok{background:var(--green)}.seg.pt{background:var(--yellow)}.seg.no{background:var(--coral)}
.seg.cur{height:16px;box-shadow:0 0 0 2px var(--ink)}
.streak{font-weight:900;font-size:.95rem;white-space:nowrap;color:var(--muted)}
.streak.hot{color:var(--coral-d);animation:flame 1s ease-in-out infinite}
@keyframes flame{50%{transform:scale(1.12)}}

/* ---------- card ---------- */
.card{background:var(--card);border-radius:24px;padding:18px 18px 22px;margin:10px 0 0;box-shadow:0 5px 0 var(--line)}
.card.ok{box-shadow:0 5px 0 var(--green)}.card.no{box-shadow:0 5px 0 var(--coral)}.card.pt{box-shadow:0 5px 0 var(--yellow)}
.ck{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.tag{font-size:.78rem;font-weight:900;padding:4px 10px;border-radius:999px;color:#fff;background:var(--teal)}
.t-case{background:var(--violet)}.t-classify{background:#1E9BD7}.t-order{background:#EF5D7A}.t-calc{background:#F5A623;color:#3A2A00}
.cn{font-size:.85rem;color:var(--muted);font-weight:800}
.q{font-size:1.2rem;font-weight:800;margin:4px 0 14px;line-height:1.35}
.sub{font-size:.85rem;color:var(--muted);margin:-6px 0 12px}
.ctx{background:color-mix(in srgb,var(--violet) 10%,var(--card));border-radius:16px;padding:12px 14px;margin-bottom:12px;font-weight:600}
.ctxk{display:block;font-size:.78rem;font-weight:900;color:var(--violet);margin-bottom:2px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--card);box-shadow:0 0 0 2px var(--line) inset,0 4px 0 var(--line);cursor:pointer;min-height:56px;transition:transform .08s}
.opt:active{transform:translateY(2px)}
.opt input[type=radio],.opt input[type=radio]:disabled{position:absolute;opacity:0!important;pointer-events:none;width:1px;height:1px;min-height:0;padding:0;border:0;margin:0}
.ol{flex:none;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-weight:900;font-size:.9rem;color:var(--muted);box-shadow:0 0 0 2px var(--line) inset}
.ot{font-weight:700;line-height:1.35}
.opt.sel{box-shadow:0 0 0 2.5px var(--teal) inset,0 4px 0 var(--teal-d);background:color-mix(in srgb,var(--teal) 9%,var(--card))}
.opt.sel .ol{background:var(--teal);color:#fff;box-shadow:none}
.opt.right{box-shadow:0 0 0 2.5px var(--green) inset,0 4px 0 var(--green-d);background:var(--green-bg)}
.opt.right .ol{background:var(--green);color:#fff;box-shadow:none}
.opt.wrong{box-shadow:0 0 0 2.5px var(--coral) inset,0 4px 0 var(--coral-d);background:var(--coral-bg)}
.opt.wrong .ol{background:var(--coral);color:#fff;box-shadow:none}
.opt:has(input:focus-visible){outline:3px solid var(--violet)}
.rows{display:flex;flex-direction:column;gap:14px}
.row{padding:12px;border-radius:16px;background:color-mix(in srgb,var(--line) 35%,var(--card))}
.row.right{background:var(--green-bg)}.row.wrong{background:var(--coral-bg)}
.rt{display:block;font-weight:800;margin-bottom:8px;line-height:1.35}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{font:inherit;font-weight:800;font-size:.86rem;border:0;border-radius:12px;padding:8px 12px;min-height:40px;background:var(--card);color:var(--ink);box-shadow:0 0 0 2px var(--line) inset,0 3px 0 var(--line);cursor:pointer;text-align:left}
.chip.on{background:var(--teal);color:#fff;box-shadow:0 3px 0 var(--teal-d)}
.chip.ans{outline:2.5px solid var(--green);outline-offset:1px}
.row.wrong .chip.on{background:var(--coral);box-shadow:0 3px 0 var(--coral-d)}
.row.right .chip.on{background:var(--green);box-shadow:0 3px 0 var(--green-d)}
.chip:disabled{cursor:default}
.chip.big{font-size:.95rem;padding:12px 14px;min-height:48px;width:100%}
.slots{list-style:none;padding:0;margin:0 0 14px;display:flex;flex-direction:column;gap:8px}
.slot{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;border:2px dashed var(--line);min-height:52px;color:var(--muted)}
.slot.full{border-style:solid;border-color:var(--teal);color:var(--ink);background:color-mix(in srgb,var(--teal) 8%,var(--card))}
.slot.right{border-color:var(--green);background:var(--green-bg)}.slot.wrong{border-color:var(--coral);background:var(--coral-bg)}
.sn{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--line);font-weight:900;color:var(--ink);flex:none}
.slot .fix{flex-basis:100%}
.pool{display:flex;flex-direction:column;gap:8px}
.fix{font-size:.82rem;color:var(--green-d);font-weight:800}
@media (prefers-color-scheme:dark){.fix{color:var(--green)}}
.stmt p{margin:8px 0;font-weight:600}
.flds{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.fld{display:flex;flex-direction:column;gap:5px;font-size:.9rem}
.fld>span:first-child{color:var(--muted);font-weight:700}
select,input,textarea{font:inherit;font-size:16px;font-weight:700;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:10px 12px;min-height:48px;width:100%}
select:focus,input:focus,textarea:focus{border-color:var(--teal);outline:none}
select:disabled,input:disabled{opacity:1;color:var(--ink)}
.fld.right input,.fld.right select{border-color:var(--green);background:var(--green-bg)}
.fld.wrong input,.fld.wrong select{border-color:var(--coral);background:var(--coral-bg)}
.tw{overflow-x:auto;margin:10px 0;-webkit-overflow-scrolling:touch;border-radius:12px}
table{border-collapse:collapse;font-size:.86rem;min-width:100%;font-weight:600}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:right;white-space:nowrap}
thead th{background:color-mix(in srgb,var(--teal) 12%,var(--card));font-weight:800}
tbody th{text-align:left;font-weight:800;background:color-mix(in srgb,var(--line) 40%,var(--card))}
table.grid{table-layout:fixed;width:100%;min-width:300px}
table.grid thead th:first-child,table.grid tbody th{width:46px;padding:4px}
table.grid th{padding:4px 2px;text-align:center}
table.grid td{padding:3px}
table.grid input{min-width:0;padding:6px 3px;font-size:15px;text-align:center;min-height:42px;border-radius:9px}
table.grid td.right input{border-color:var(--green);background:var(--green-bg)}
table.grid td.wrong input{border-color:var(--coral);background:var(--coral-bg)}
table.grid .fix{display:block;text-align:center}

/* ---------- CTA și foaia de feedback ---------- */
.cta{position:sticky;bottom:0;margin:16px -16px 0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%)}
.sheet{position:sticky;bottom:0;z-index:5;margin:16px -16px 0;padding:16px 16px calc(14px + env(safe-area-inset-bottom));border-radius:24px 24px 0 0;animation:sheet .32s cubic-bezier(.2,.9,.3,1.2)}
.sheet:focus{outline:none}
.sheet.ok{background:var(--green-bg);color:var(--green-d)}
.sheet.no{background:var(--coral-bg);color:var(--coral-d)}
.sheet.pt{background:var(--amber-bg);color:var(--amber)}
@media (prefers-color-scheme:dark){.sheet.ok{color:var(--green)}.sheet.no{color:#FF9A8E}}
@keyframes sheet{from{transform:translateY(100%)}to{transform:none}}
.sh{display:flex;align-items:center;gap:10px;font-size:1.25rem}
.si{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:currentColor;flex:none}
.si{color:inherit}.sheet .si{font-size:1.1rem}
.sheet.ok .si{background:var(--green);color:#fff}.sheet.no .si{background:var(--coral);color:#fff}.sheet.pt .si{background:var(--yellow);color:#3A2A00}
.sb{color:var(--ink);font-weight:600;max-height:40vh;overflow:auto;margin:8px 0 12px}
.sb p{margin:4px 0}
.sol summary{cursor:pointer;font-weight:900;color:var(--teal-d);padding:6px 0;min-height:40px}
.sa{display:flex;gap:10px}
.sa .btn.big{flex:1}
.sheet.ok .sa .btn.big{background:var(--green);box-shadow:0 4px 0 var(--green-d)}
.sheet.no .sa .btn.big{background:var(--coral);box-shadow:0 4px 0 var(--coral-d)}
.sheet.pt .sa .btn.big{background:var(--yellow);color:#3A2A00;box-shadow:0 4px 0 var(--yellow-d)}

/* ---------- intro modul ---------- */
.mi{text-align:center;padding-bottom:20px}
.scene{width:100%;max-width:420px;height:auto;display:block;margin:4px auto 6px}
.scene .box{animation:slide 4s linear infinite}
@keyframes slide{from{transform:translateX(-30px)}to{transform:translateX(30px)}}
.mi h1{font-size:clamp(1.6rem,6.6vw,2.2rem);margin:6px 0 10px}
.mst{display:flex;justify-content:center;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-weight:800}
.mst .stz{color:var(--yellow-d);letter-spacing:2px}
.keyc{text-align:left;background:var(--card);border-radius:var(--r);padding:16px 18px;margin:18px 0;box-shadow:0 4px 0 var(--line);border-top:6px solid var(--c)}
.keyc h2{font-size:1.1rem;margin-bottom:6px}
.keyc ul{margin:0;padding-left:20px}
.keyc li{margin:6px 0;font-weight:600}
.mact{display:flex;flex-direction:column;gap:12px}

/* ---------- rezultat ---------- */
.res{text-align:center;padding:30px 0 20px}
.rstars{display:flex;justify-content:center;gap:6px;margin-bottom:8px}
.rs{font-size:3.6rem;color:var(--line);line-height:1}
.rs.on{color:var(--yellow);text-shadow:0 4px 0 var(--yellow-d);animation:pop .5s cubic-bezier(.3,1.6,.5,1) both;animation-delay:var(--d)}
.rs:nth-child(2){font-size:4.4rem;transform:translateY(-10px)}
.rs.on:nth-child(2){animation-name:pop2}
@keyframes pop{from{transform:scale(0) rotate(-40deg)}to{transform:none}}
@keyframes pop2{from{transform:translateY(-10px) scale(0) rotate(-40deg)}to{transform:translateY(-10px)}}
.rp{font-size:4.2rem;font-weight:900;margin:0;line-height:1.05;color:var(--teal-d)}
.rm{max-width:30ch;margin:6px auto 18px;font-weight:700}
.rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.rgrid div{background:var(--card);border-radius:16px;padding:12px 6px;box-shadow:0 4px 0 var(--line);display:flex;flex-direction:column}
.rgrid b{font-size:1.4rem;color:var(--violet)}
.rgrid span{font-size:.78rem;color:var(--muted)}
.rnb{margin-bottom:18px}.rnb h2{font-size:1.1rem;margin-bottom:8px}
.rnb .bdg{max-width:260px;margin:0 auto 8px}
.pop{animation:pop .6s cubic-bezier(.3,1.6,.5,1) both .9s}

/* ---------- efecte ---------- */
.in-right{animation:inR .28s ease-out}.in-left{animation:inL .28s ease-out}.in-up{animation:inU .35s ease-out}
@keyframes inR{from{opacity:0;transform:translateX(40px)}}@keyframes inL{from{opacity:0;transform:translateX(-40px)}}@keyframes inU{from{opacity:0;transform:translateY(24px)}}
.pulse{animation:pulse .4s ease}@keyframes pulse{40%{transform:scale(1.025)}}
.shake{animation:shake .4s ease}@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.toast{position:fixed;left:50%;top:14px;z-index:20;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:16px;font-weight:800;box-shadow:0 6px 20px rgba(0,0,0,.2);animation:tin .35s cubic-bezier(.2,1.4,.4,1);max-width:90vw;text-align:center}
.toast.big{background:var(--violet);color:#fff}
.toast.out{opacity:0;transform:translate(-50%,-20px);transition:.4s}
@keyframes tin{from{transform:translate(-50%,-40px);opacity:0}}
.xpf{white-space:nowrap;position:absolute;z-index:21;transform:translateX(-50%);font-weight:900;color:var(--violet);font-size:1.3rem;pointer-events:none;animation:xpf 1.2s ease-out forwards}
@keyframes xpf{0%{opacity:0;transform:translate(-50%,0)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-60px)}}
.conf{position:fixed;inset:0;z-index:30;pointer-events:none}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---------- vieți ---------- */
.lives{display:flex;gap:1px;font-size:1.15rem;line-height:1}
.hrt{color:var(--coral);display:inline-block}
.hrt.off{color:var(--line)}
.hrt.lost{animation:lost .7s ease}
@keyframes lost{0%{color:var(--coral);transform:scale(1.6)}60%{transform:scale(.6) rotate(-20deg)}100%{transform:none}}
.lifel{font-weight:900;color:var(--coral-d);margin:0 0 6px}
@media (prefers-color-scheme:dark){.lifel{color:#FF9A8E}}
.corr{margin:0 0 6px}

<body>
<main id="app"></main>
<noscript>Aplicația are nevoie de JavaScript activat.</noscript>
<script>/* ===== Generatoare de exerciții numerice (date aleatoare, reproductibile prin seed) ===== */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function mkR(seed){const r=mulberry32(seed);const R={
  f:r,
  i:(a,b)=>a+Math.floor(r()*(b-a+1)),
  pick:a=>a[Math.floor(r()*a.length)],
  shuffle:a=>{a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(r()*(k+1));[a[k],a[j]]=[a[j],a[k]];}return a;}
};return R;}
const nf=(n,d=0)=>Number(n).toLocaleString("ro-RO",{minimumFractionDigits:d,maximumFractionDigits:d});
const tbl=(head,rows,cls="")=>`<div class="tw"><table class="${cls}"><thead><tr>${head.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((c,i)=>i===0?`<th scope="row">${c}</th>`:`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
function perms(a){if(a.length<=1)return[a];const out=[];a.forEach((x,i)=>perms(a.slice(0,i).concat(a.slice(i+1))).forEach(p=>out.push([x].concat(p))));return out;}
function uniq(n,a,b,R){const s=new Set();while(s.size<n)s.add(R.i(a,b));return R.shuffle([...s]);}

const GEN={

/* ---------- MODUL 3: planificare agregat ---------- */
agregat(seed){
  let R=mkR(seed),g;
  for(let tries=0;tries<200;tries++){
    const W=R.pick([100,150,200,250]), norm=R.pick([2000,4000,5000]), cap=W*norm;
    let w=[0,0,0,0].map(()=>Math.round(R.i(Math.round(W*0.25),Math.round(W*1.6))/5)*5);
    const rem=w.reduce((a,b)=>a+b,0)%20; w[3]+= (rem?20-rem:0);
    const avgW=w.reduce((a,b)=>a+b,0)/4;
    if(!(w.some(x=>x>W)&&w.some(x=>x<W)&&avgW<W&&avgW>0&&w.every(x=>x>0)))continue;
    const d=w.map(x=>x*norm);
    const c={c1:R.pick([4,5,6,8]),c2:R.pick([12,15,18]),c3:R.pick([3000,4000,5000]),c4:R.pick([18,20,25]),c5:R.pick([2000,2500,3000])};
    // S1 supramuncă și inactivitate
    const s1=d.map(x=>x<cap?{t:"inactivitate",n:(cap-x)/norm,v:(cap-x)/norm*c.c3}:x>cap?{t:"supramuncă",n:x-cap,v:(x-cap)*c.c2}:{t:"-",n:0,v:0});
    const S1=s1.reduce((a,b)=>a+b.v,0);
    // S2 angajări/demiteri
    let prev=W;const s2=w.map(x=>{const ch=x-prev;prev=x;return{ch,v:Math.abs(ch)*c.c5};});
    const S2=s2.reduce((a,b)=>a+b.v,0);
    // S3 producție constantă = cerere medie
    const P=avgW*norm, idle=W-avgW;let inv=0;
    const s3=d.map(x=>{inv+=P-x;const st=inv>0?inv*c.c1:0,df=inv<0?-inv*c.c4:0,ia=idle*c.c3;return{inv,st,df,ia,v:st+df+ia};});
    const S3=s3.reduce((a,b)=>a+b.v,0);
    const tot=[S1,S2,S3];const mn=Math.min(...tot);if(tot.filter(x=>x===mn).length>1)continue;
    g={W,norm,cap,w,d,c,s1,S1,s2,S2,P,idle,s3,S3,best:tot.indexOf(mn)};break;
  }
  const {W,norm,cap,d,c}=g;
  return{
    text:`<p>O firmă are <b>${W} muncitori</b>, fiecare cu o normă trimestrială de <b>${nf(norm)} unități echivalente</b> (capacitate: ${nf(cap)} u/trimestru). Nu există stoc inițial de produse finite.</p>
    ${tbl(["Trimestrul","I","II","III","IV"],[["Cererea (u)",...d.map(x=>nf(x))]])}
    ${tbl(["Cost unitar","Valoare"],[["c1 întreținere stoc","%s u.m./u".replace("%s",c.c1)],["c2 supramuncă",c.c2+" u.m./u"],["c3 inactivitate",nf(c.c3)+" u.m./muncitor"],["c4 deficit",c.c4+" u.m./u"],["c5 angajare/concediere",nf(c.c5)+" u.m./persoană"]])}
    <p>Calculați extracosturile totale pentru cele trei strategii pure. La strategia 3, producția trimestrială este egală cu cererea medie, deficitul se reportează în trimestrul următor (se plătește c4 pentru fiecare unitate restantă la final de trimestru), iar muncitorii neocupați generează cost de inactivitate.</p>`,
    fields:[
      {label:"Strategia 1: supramuncă și inactivitate (u.m.)",ans:g.S1},
      {label:"Strategia 2: urmărirea cererii prin angajări/demiteri (u.m.)",ans:g.S2},
      {label:"Strategia 3: producție constantă = cererea medie (u.m.)",ans:g.S3},
      {label:"Strategia cea mai ieftină",type:"select",options:["Strategia 1","Strategia 2","Strategia 3"],ans:g.best}
    ],
    sol:`<p><b>Strategia 1.</b> Când cererea e sub capacitate, muncitorii în plus = (capacitate − cerere) / normă, cost c3 pe muncitor. Când e peste, unitățile în plus se fac în supramuncă, cost c2.</p>
    ${tbl(["Trim.","Situație","Cantitate","Cost"],g.s1.map((s,i)=>[["I","II","III","IV"][i],s.t,s.t==="inactivitate"?s.n+" muncitori":s.t==="supramuncă"?nf(s.n)+" u":"-",nf(s.v)]))}
    <p>Total: <b>${nf(g.S1)} u.m.</b></p>
    <p><b>Strategia 2.</b> Necesar muncitori = cerere / normă. Se plătește c5 pentru fiecare persoană angajată sau concediată față de trimestrul anterior (start: ${W}).</p>
    ${tbl(["Trim.","Muncitori necesari","Variație","Cost"],g.w.map((x,i)=>[["I","II","III","IV"][i],x,(g.s2[i].ch>0?"+":"")+g.s2[i].ch,nf(g.s2[i].v)]))}
    <p>Total: <b>${nf(g.S2)} u.m.</b></p>
    <p><b>Strategia 3.</b> Producție = ${nf(g.P)} u/trimestru, deci sunt necesari ${g.P/norm} muncitori; ${g.idle} muncitori rămân inactivi în fiecare trimestru (${nf(g.idle*c.c3)} u.m.).</p>
    ${tbl(["Trim.","Stoc(+)/deficit(−) cumulat","c1 stoc","c4 deficit","c3 inactiv.","Total"],g.s3.map((s,i)=>[["I","II","III","IV"][i],nf(s.inv),nf(s.st),nf(s.df),nf(s.ia),nf(s.v)]))}
    <p>Total: <b>${nf(g.S3)} u.m.</b> Cea mai ieftină: <b>strategia ${g.best+1}</b>.</p>`
  };
},

/* ---------- MODUL 3: reguli de prioritate SPT ---------- */
spt(seed){
  const R=mkR(seed);let t,d,C;
  for(;;){t=uniq(5,2,9,R);d=t.map(x=>x+R.i(1,18));
    const ord=[0,1,2,3,4].sort((a,b)=>t[a]-t[b]);let c=0;C=[];ord.forEach(k=>{c+=t[k];C[k]=c;});
    const late=C.filter((x,k)=>x>d[k]).length;if(late>=1&&late<=3)break;}
  const ord=[0,1,2,3,4].sort((a,b)=>t[a]-t[b]);
  const flow=C.reduce((a,b)=>a+b,0)/5, lat=C.reduce((a,x,k)=>a+Math.max(0,x-d[k]),0)/5;
  const names=["C1","C2","C3","C4","C5"];
  return{
    text:`<p>Cinci comenzi așteaptă în fața aceluiași utilaj. Toate sunt disponibile din ziua 0.</p>
    ${tbl(["Comanda",...names],[["Timp de procesare (zile)",...t],["Termen de livrare (ziua)",...d]])}
    <p>Aplicați regula <b>„primul în fabricație, produsul cu cel mai mic timp de procesare”</b> (SPT). Calculați timpul mediu petrecut în atelier (media momentelor de terminare) și întârzierea medie, calculată pentru toate cele 5 comenzi (comenzile livrate la timp au întârziere 0).</p>`,
    fields:[...[1,2,3,4,5].map(p=>({label:`Poziția ${p}`,type:"select",options:names,ans:ord[p-1],short:true})),
      {label:"Timpul mediu petrecut în atelier (zile)",ans:flow,dec:1},
      {label:"Întârzierea medie (zile)",ans:lat,dec:1}],
    sol:`<p>Ordinea crescătoare a timpilor de procesare: <b>${ord.map(k=>names[k]).join(", ")}</b>.</p>
    ${tbl(["Comanda","Procesare","Terminare","Termen","Întârziere"],ord.map(k=>[names[k],t[k],C[k],d[k],Math.max(0,C[k]-d[k])]))}
    <p>Timp mediu = ${C.reduce((a,b)=>a+b,0)} / 5 = <b>${nf(flow,1)} zile</b>. Întârziere medie = ${C.reduce((a,x,k)=>a+Math.max(0,x-d[k]),0)} / 5 = <b>${nf(lat,1)} zile</b>.</p>`
  };
},

/* ---------- MODUL 3: regula rezervei minime ---------- */
slack(seed){
  const R=mkR(seed);let t,d,s;
  for(;;){t=[0,1,2,3,4].map(()=>R.i(2,10));d=t.map(x=>x+R.i(0,14));s=d.map((x,k)=>x-t[k]);if(new Set(s).size===5)break;}
  const ord=[0,1,2,3,4].sort((a,b)=>s[a]-s[b]);const names=["L1","L2","L3","L4","L5"];
  return{
    text:`<p>Într-o tipografie sosesc cinci lucrări. Data curentă este ziua 0.</p>
    ${tbl(["Lucrarea",...names],[["Durata de fabricație (zile)",...t],["Termen de livrare (ziua)",...d]])}
    <p>Stabiliți ordinea de lansare după regula <b>„primul în fabricație, produsul cu cea mai mică rezervă de timp”</b>. Rezerva = termen − data curentă − durata de fabricație.</p>`,
    fields:[...[1,2,3,4,5].map(p=>({label:`Poziția ${p}`,type:"select",options:names,ans:ord[p-1],short:true})),
      {label:`Rezerva de timp a lucrării ${names[ord[0]]} (zile)`,ans:s[ord[0]]}],
    sol:`${tbl(["Lucrarea","Termen","Durată","Rezervă"],names.map((n,k)=>[n,d[k],t[k],s[k]]))}<p>Ordine crescătoare a rezervei: <b>${ord.map(k=>names[k]).join(", ")}</b>. Prima se lansează lucrarea cu rezerva ${s[ord[0]]} zile, pentru că riscă cel mai repede să întârzie.</p>`
  };
},

/* ---------- MODUL 3: indice de prioritate Pij(t) ---------- */
indice(seed){
  const R=mkR(seed);let Tt,Dcf,P;const Tc=R.i(5,15);
  for(;;){Tt=[0,1,2,3].map(()=>Tc+R.i(10,35));Dcf=[0,1,2,3].map(()=>R.i(5,30));P=Tt.map((x,k)=>x-Tc-Dcf[k]);if(new Set(P).size===4&&P.some(x=>x<5))break;}
  const names=["Cmd 1","Cmd 2","Cmd 3","Cmd 4"];const first=P.indexOf(Math.min(...P));
  return{
    text:`<p>Pentru patru comenzi aflate la aceeași mașină se calculează indicele de prioritate <b>P(t) = Tt − Tc − Dcf</b> (în zile), unde Tt este termenul de livrare, Tc data curentă, iar Dcf durata ciclului de fabricație rămas. Data curentă: <b>Tc = ziua ${Tc}</b>.</p>
    ${tbl(["Comanda",...names],[["Tt (ziua)",...Tt],["Dcf (zile)",...Dcf]])}
    <p>Calculați indicii și precizați comanda care trece prima. Un indice mai mic înseamnă o comandă mai urgentă; un indice negativ arată că termenul nu mai poate fi respectat fără măsuri.</p>`,
    fields:[...names.map((n,k)=>({label:`P(t) ${n}`,ans:P[k],short:true})),{label:"Comanda care trece prima",type:"select",options:names,ans:first}],
    sol:`${tbl(["Comanda","Calcul","P(t)"],names.map((n,k)=>[n,`${Tt[k]} − ${Tc} − ${Dcf[k]}`,P[k]]))}<p>Indicele cel mai mic are <b>${names[first]}</b>, deci ea trece prima.</p>`
  };
},

/* ---------- MODUL 3: problema de repartizare ---------- */
repartizare(seed){
  const R=mkR(seed);let M,best,bestP;
  for(;;){M=[0,1,2,3].map(()=>[0,1,2,3].map(()=>R.i(3,12)));const all=perms([0,1,2,3]).map(p=>({p,s:p.reduce((a,j,i)=>a+M[i][j],0)}));
    const mn=Math.min(...all.map(x=>x.s));const opt=all.filter(x=>x.s===mn);if(opt.length===1){best=mn;bestP=opt[0].p;break;}}
  const ex=["A","B","C","D"],lu=["L1","L2","L3","L4"];
  return{
    text:`<p>Patru executanți trebuie să primească fiecare câte o singură lucrare (model de repartizare/afectare). Timpii de execuție, în ore:</p>
    ${tbl(["Executant",...lu],M.map((r,i)=>[ex[i],...r]))}
    <p>Formați perechile executant–lucrare astfel încât timpul total să fie minim.</p>`,
    fields:[...ex.map((e,i)=>({label:`Executantul ${e}`,type:"select",options:lu,ans:bestP[i],short:true})),{label:"Timpul total minim (ore)",ans:best}],
    sol:`<p>Repartizarea optimă: <b>${ex.map((e,i)=>e+" → "+lu[bestP[i]]).join(", ")}</b>, cu timpul total ${ex.map((e,i)=>M[i][bestP[i]]).join(" + ")} = <b>${best} ore</b>. Pentru 4×4 există 24 de combinații; în practică se folosește metoda ungară sau un ERP.</p>`
  };
},

/* ---------- MODUL 4: MRP calculul cererii nete ---------- */
mrp(seed){
  const R=mkR(seed);let g;
  for(;;){
    const Te=R.pick([1,2]),D0=R.i(4,15)*10,SS=R.pick([0,10,20,30]),rpT=R.i(1,3),rpQ=R.i(5,20)*10;
    const CB=[0,0,0,0,0,0];R.shuffle([1,2,3,4,5]).slice(0,4).forEach(k=>CB[k]=R.i(5,30)*10);
    let D=D0;const Dv=[],CN=[];
    for(let i=0;i<6;i++){Dv.push(D);const RP=i+1===rpT?rpQ:0;const av=D+RP-CB[i];let cn=0;if(av<SS){cn=SS-av;}CN.push(cn);D=av+cn;}
    if(CN.slice(0,Te).some(x=>x>0))continue;if(CN.filter(x=>x>0).length<2)continue;
    const LPF=[0,0,0,0,0,0];CN.forEach((x,i)=>{if(x>0)LPF[i-Te]=x;});
    g={Te,D0,SS,rpT,rpQ,CB,CN,LPF,Dv};break;}
  const {Te,D0,SS,rpT,rpQ,CB,CN,LPF}=g;const per=[1,2,3,4,5,6];
  const fields=[];per.forEach((p,i)=>fields.push({label:`CN p${p}`,ans:CN[i],row:0,col:i}));per.forEach((p,i)=>fields.push({label:`LPF p${p}`,ans:LPF[i],row:1,col:i}));
  return{
    text:`<p>Produsul P: disponibil inițial <b>D = ${D0}</b> buc, stoc de siguranță <b>SS = ${SS}</b>, timp de execuție <b>Te = ${Te}</b> ${Te===1?"perioadă":"perioade"}, lot pe lot. Recepție programată: <b>${rpQ}</b> buc în perioada ${rpT}.</p>
    ${tbl(["Perioada",...per],[["Cerere brută CB",...CB.map(x=>x||"–")],["Recepții programate RP",...per.map(p=>p===rpT?rpQ:"–")]])}
    <p>Folosiți <b>CN = CB − (D − SS) − RP</b> (dacă rezultatul e negativ, CN = 0) și <b>D(i+1) = D(i) + RP(i) − CB(i) + CN(i)</b>. Recepția planificată este egală cu CN, iar lansarea în fabricație (LPF) se face cu Te perioade înainte. Scrieți 0 unde nu există cerere netă sau lansare.</p>`,
    table:{cols:per.map(p=>"p"+p),rows:["CN","LPF"]},
    fields,
    sol:`${tbl(["Perioada",...per],[["CB",...CB],["D la început",...g.Dv],["RP",...per.map(p=>p===rpT?rpQ:0)],["CN",...CN],["LPF",...LPF]])}
    <p>Exemplu: în prima perioadă cu CN &gt; 0, disponibilul nu mai acoperă cererea brută plus stocul de siguranță, deci se comandă exact diferența. După recepție, disponibilul revine la nivelul SS = ${SS}. Fiecare cantitate se lansează cu ${Te} ${Te===1?"perioadă":"perioade"} mai devreme.</p>`
  };
},

/* ---------- MODUL 4: explozia listei de materiale ---------- */
bom(seed){
  const R=mkR(seed);
  const N=R.i(10,50)*10,qb=R.i(1,3),qc=R.i(2,4),qd=R.i(2,5),sA=R.i(0,5)*10,sB=R.i(0,8)*10,sC=R.i(0,10)*10,sD=R.i(0,30)*10;
  const nA=Math.max(0,N-sA),cbB=qb*nA,nB=Math.max(0,cbB-sB),cbC=qc*nA,nC=Math.max(0,cbC-sC),cbD=qd*nB,nD=Math.max(0,cbD-sD);
  return{
    text:`<p>Produsul A are structura: <b>A → B (${qb} buc) + C (${qc} buc)</b>; subansamblul <b>B → D (${qd} buc)</b>. Clientul comandă <b>${N} buc</b> din A.</p>
    ${tbl(["Articol","A","B","C","D"],[["Nivel","0","1","1","2"],["Stoc disponibil",sA,sB,sC,sD]])}
    <p>Nu există stoc de siguranță sau recepții programate. Calculați cererea netă pentru fiecare articol. Atenție: cererea brută a unei componente se calculează din cererea netă a părintelui.</p>`,
    fields:[{label:"CN pentru A",ans:nA},{label:"CN pentru B",ans:nB},{label:"CN pentru C",ans:nC},{label:"CN pentru D",ans:nD}],
    sol:`${tbl(["Articol","Cerere brută","Stoc","Cerere netă"],[["A",N,sA,nA],["B",`${qb} × ${nA} = ${cbB}`,sB,nB],["C",`${qc} × ${nA} = ${cbC}`,sC,nC],["D",`${qd} × ${nB} = ${cbD}`,sD,nD]])}<p>Aceasta este cererea <b>dependentă</b>: nu se previzionează, ci se calculează exact din structura produsului.</p>`
  };
},

/* ---------- MODUL 5: tipul de producție după No ---------- */
tipprod(seed){
  const R=mkR(seed);const pool=[[1],[3,4,5],[7,8,9],[11,12,13,14,15,16,17,18,19],[22,25,28,31,36,40]];
  const ks=R.shuffle([0,1,2,3,4]).slice(0,4);const vals=ks.map(k=>R.pick(pool[k]));
  const opts=["masă","serie mare","serie mijlocie","serie mică","individuală"];const loc=["Strung CNC 1","Presă 3","Freză 2","Banc montaj 4"];
  return{
    text:`<p>S-a determinat numărul de obiecte-operație (No) executate la patru locuri de muncă. Stabiliți tipul de producție pentru fiecare.</p>${tbl(["Loc de muncă","No"],loc.map((l,i)=>[l,vals[i]]))}`,
    fields:loc.map((l,i)=>({label:l,type:"select",options:opts,ans:ks[i]})),
    sol:`<p>Pragurile: No = 1 masă; 2–6 serie mare; 6–10 serie mijlocie; 10–20 serie mică; peste 20 individuală.</p>${tbl(["Loc de muncă","No","Tip"],loc.map((l,i)=>[l,vals[i],opts[ks[i]]]))}<p>Cu cât No crește, cu atât locul de muncă este mai puțin specializat și organizarea trebuie să fie mai flexibilă.</p>`
  };
},

/* ---------- MODUL 6: EOQ, număr de loturi, periodicitate ---------- */
eoq(seed){
  const R=mkR(seed);let D,Co,Ch,L0,nL,Rr,Dcf,rel;
  for(;;){D=R.i(6,30)*1000;Co=R.i(2,10)*50;Ch=R.i(2,20);L0=Math.round(Math.sqrt(2*D*Co/Ch));nL=D/L0;Rr=250/nL;
    if(Rr<4||Rr>60)continue;const off=R.pick([-1,1])*R.i(3,8);Dcf=Math.max(2,Math.round(Rr)+off);rel=Rr>Dcf?0:1;break;}
  return{
    text:`<p>O piesă standard are cererea anuală <b>D = ${nf(D)} buc</b>, costul lansării unui lot <b>Co = ${Co} lei</b> și costul de stocare <b>Ch = ${Ch} lei/buc/an</b>. Anul are <b>250 zile lucrătoare</b>, iar durata ciclului de fabricație este <b>Dcf = ${Dcf} zile</b>.</p>
    <p>Calculați lotul optim <b>L₀ = √(2·D·Co / Ch)</b> (rotunjit la bucată), numărul de loturi <b>nL = D / L₀</b> și periodicitatea lansării <b>R = T / nL</b>.</p>`,
    fields:[{label:"L₀ (buc)",ans:L0,tolAbs:1},{label:"nL (loturi/an, 2 zecimale)",ans:nL,dec:2,tolAbs:0.06},{label:"R (zile, 1 zecimală)",ans:Rr,dec:1,tolAbs:0.2},
      {label:"Comparând R cu Dcf",type:"select",options:["R > Dcf: între loturi apar intervale fără lot în fabricație","R < Dcf: mai multe loturi se află simultan în fabricație","R = Dcf: lotul următor se lansează exact când se termină precedentul"],ans:rel}],
    sol:`<p>L₀ = √(2 × ${nf(D)} × ${Co} / ${Ch}) = √${nf(2*D*Co/Ch)} ≈ <b>${nf(L0)} buc</b>.</p><p>nL = ${nf(D)} / ${nf(L0)} ≈ <b>${nf(nL,2)} loturi/an</b>.</p><p>R = 250 / ${nf(nL,2)} ≈ <b>${nf(Rr,1)} zile</b>.</p><p>Cum R ${rel===0?"&gt;":"&lt;"} Dcf (${Dcf} zile), ${rel===0?"locurile de muncă rămân fără lotul respectiv o parte din timp, deci pot fi încărcate cu alte produse.":"loturile se suprapun în fabricație, ceea ce crește stocul de producție neterminată."}</p>`
  };
},

/* ---------- MODUL 6: costul a două mărimi de lot ---------- */
costlot(seed){
  const R=mkR(seed);const D=R.i(8,24)*1000,Co=R.i(2,8)*50,Ch=R.i(4,15);const L0=Math.sqrt(2*D*Co/Ch);
  const L1=Math.max(50,Math.round(L0*R.pick([0.3,0.4,0.5])/50)*50),L2=Math.round(L0*R.pick([2.5,3,4])/100)*100;
  const c=L=>({n:D/L,cl:D/L*Co,sm:L/2,cs:L/2*Ch,t:D/L*Co+L/2*Ch});const a=c(L1),b=c(L2);
  return{
    text:`<p>Cerere anuală <b>${nf(D)} buc</b>, cost lansare <b>${Co} lei/lot</b>, cost de stocare <b>${Ch} lei/buc/an</b>. Comparați un lot mic de <b>${nf(L1)} buc</b> cu un lot mare de <b>${nf(L2)} buc</b>.</p><p>Cost total anual = (D / L) × Co + (L / 2) × Ch. Stocul mediu este L / 2.</p>`,
    fields:[{label:`Cost total pentru lotul de ${nf(L1)} buc (lei)`,ans:a.t,tolRel:0.005},{label:`Cost total pentru lotul de ${nf(L2)} buc (lei)`,ans:b.t,tolRel:0.005},
      {label:"Ce componentă domină la lotul mic?",type:"select",options:["Costul de lansare","Costul de stocare"],ans:a.cl>a.cs?0:1}],
    sol:`${tbl(["Indicator",nf(L1)+" buc",nf(L2)+" buc"],[["Nr. loturi/an",nf(a.n,2),nf(b.n,2)],["Cost lansare",nf(a.cl),nf(b.cl)],["Stoc mediu",nf(a.sm),nf(b.sm)],["Cost stocare",nf(a.cs),nf(b.cs)],["Cost total",nf(a.t),nf(b.t)]])}<p>Lotul mic înseamnă lansări dese și reglaje frecvente; lotul mare blochează bani în stoc. Lotul optim (≈ ${nf(Math.round(L0))} buc) echilibrează cele două costuri.</p>`
  };
},

/* ---------- MODUL 6: durata ciclului de producție ---------- */
dcp(seed){
  const R=mkR(seed);const v={Tpi:R.i(2,8),Tteh:R.i(30,90),Tn:R.pick([0,0,12,24,48]),Tct:R.i(2,10),Ttr:R.i(3,15),Tintr:R.i(10,60)};
  const S=Object.values(v).reduce((a,b)=>a+b,0);const pct=v.Tteh/S*100;
  const lab={Tpi:"pregătire-încheiere",Tteh:"tehnologic",Tn:"procese naturale",Tct:"control tehnic",Ttr:"transport",Tintr:"întreruperi"};
  return{
    text:`<p>Pentru un lot de piese s-au înregistrat următorii timpi (ore):</p>${tbl(["Componentă","Ore"],Object.keys(v).map(k=>[`${k} (${lab[k]})`,v[k]]))}
    <p>Calculați durata ciclului de producție <b>Dcp = Tpi + Tteh + Tn + Tct + Ttr + Tîntr</b> și ponderea timpului tehnologic în Dcp.</p>`,
    fields:[{label:"Dcp (ore)",ans:S},{label:"Ponderea Tteh în Dcp (%, 1 zecimală)",ans:pct,dec:1,tolAbs:0.15},
      {label:"Cea mai directă cale de reducere a Dcp aici",type:"select",options:["Reducerea întreruperilor interoperații","Creșterea stocului de siguranță","Mărirea lotului de fabricație"],ans:0}],
    sol:`<p>Dcp = ${Object.values(v).join(" + ")} = <b>${S} ore</b>. Ponderea Tteh = ${v.Tteh} / ${S} × 100 ≈ <b>${nf(pct,1)}%</b>.</p><p>Timpul de întreruperi (${v.Tintr} ore) e timp în care piesa doar așteaptă: nu adaugă valoare, dar lungește ciclul și ține bani blocați în producția neterminată. Să tai din așteptări e de obicei mai ieftin decât să accelerezi prelucrarea. Stocul de siguranță și lotul mai mare ar lungi ciclul, nu l-ar scurta.</p>`
  };
},

/* ---------- MODUL 6: periodicitate cu nL întreg ---------- */
period(seed){
  const R=mkR(seed);const nL=R.pick([10,12,16,20,25]),L0=R.i(3,12)*100,N=nL*L0,T=R.pick([250,240]);const Rr=T/nL;
  return{
    text:`<p>Program anual <b>N = ${nf(N)} buc</b>, lot optim <b>L₀ = ${nf(L0)} buc</b>, fond de timp <b>T = ${T} zile</b>. Calculați numărul de loturi și periodicitatea lansării.</p>`,
    fields:[{label:"nL (loturi)",ans:nL},{label:"R (zile)",ans:Rr,dec:1,tolAbs:0.05}],
    sol:`<p>nL = N / L₀ = ${nf(N)} / ${nf(L0)} = <b>${nL}</b>. R = T / nL = ${T} / ${nL} = <b>${nf(Rr,1)} zile</b>: la fiecare ${nf(Rr,1)} zile se lansează un nou lot.</p>`
  };
},

/* ---------- MODUL 7: algoritmul Johnson ---------- */
johnson(seed){
  const R=mkR(seed);const v=uniq(10,1,14,R);const a=v.slice(0,5),b=v.slice(5);const names=["R1","R2","R3","R4","R5"];
  let left=[],right=[],rem=[0,1,2,3,4];
  while(rem.length){let best=null;rem.forEach(k=>{if(!best||a[k]<best.v)best={k,v:a[k],m:1};if(b[k]<best.v)best={k,v:b[k],m:2};});
    if(best.m===1)left.push(best.k);else right.unshift(best.k);rem=rem.filter(k=>k!==best.k);}
  const ord=left.concat(right);let t1=0,t2=0;ord.forEach(k=>{t1+=a[k];t2=Math.max(t2,t1)+b[k];});
  let x1=0,x2=0;const rows=ord.map(k=>{x1+=a[k];const s2=Math.max(x2,x1);x2=s2+b[k];return[names[k],`${x1-a[k]}–${x1}`,`${s2}–${x2}`];});
  return{
    text:`<p>Cinci repere trec, în aceeași ordine, prin utilajul U1 și apoi prin U2. Timpii de prelucrare (ore):</p>${tbl(["Utilaj",...names],[["U1",...a],["U2",...b]])}
    <p>Stabiliți succesiunea optimă cu algoritmul Johnson și durata totală de prelucrare (momentul în care ultimul reper iese de pe U2).</p>`,
    fields:[...[1,2,3,4,5].map(p=>({label:`Poziția ${p}`,type:"select",options:names,ans:ord[p-1],short:true})),{label:"Durata totală (ore)",ans:t2}],
    sol:`<p>Se caută minimul din tabel: dacă e pe U1, reperul merge cât mai în față; dacă e pe U2, cât mai în spate. Se elimină reperul și se repetă.</p><p>Succesiune: <b>${ord.map(k=>names[k]).join(", ")}</b>.</p>${tbl(["Reper","U1 (start–sfârșit)","U2 (start–sfârșit)"],rows)}<p>Durata totală: <b>${t2} ore</b>.</p>`
  };
},

/* ---------- MODUL 7: regula Next Best cu origine fixă ---------- */
nb(seed){
  const R=mkR(seed);const names=["P1","P2","P3","P4"];let M,ord,tot;
  for(;;){const vals=uniq(12,120,199,R).map(x=>x/100);let k=0;M=names.map((_,i)=>names.map((_,j)=>i===j?null:vals[k++]));
    ord=[0];tot=0;let cur=0,rem=[1,2,3];while(rem.length){let nx=rem.reduce((b,j)=>M[cur][j]<M[cur][b]?j:b,rem[0]);tot+=M[cur][nx];ord.push(nx);rem=rem.filter(j=>j!==nx);cur=nx;}break;}
  return{
    text:`<p>Pe utilajul U1 se execută patru produse. Timpii de reglare (ore) la trecerea de la produsul de pe linie la cel de pe coloană:</p>
    ${tbl(["Din \\ în",...names],M.map((r,i)=>[names[i],...r.map(x=>x===null?"–":nf(x,2))]))}
    <p>Aplicați regula <b>NB de bază (cu origine fixă)</b>, începând cu P1: după fiecare produs alegeți următorul cu cel mai mic timp de reglare. Calculați timpul total de reglare.</p>`,
    fields:[...[2,3,4].map(p=>({label:`Poziția ${p}`,type:"select",options:names,ans:ord[p-1],short:true})),{label:"Timp total de reglare (ore, 2 zecimale)",ans:tot,dec:2,tolAbs:0.006}],
    sol:`<p>Succesiune: <b>${ord.map(k=>names[k]).join(" → ")}</b>.</p><p>Timp total = ${ord.slice(1).map((k,i)=>nf(M[ord[i]][k],2)).join(" + ")} = <b>${nf(tot,2)} ore</b>.</p><p>NB este euristic: alege la fiecare pas varianta cea mai bună în acel moment, fără garanția optimului global.</p>`
  };
},

/* ---------- MODUL 8: grafic Gantt cumulativ ---------- */
gantt(seed){
  const R=mkR(seed);const pz=R.i(4,8),n=10;const real=Array.from({length:n},()=>Math.max(0,pz+R.i(-3,1)));
  let cp=0,cr=0;const CP=[],CR=[];for(let i=0;i<n;i++){cp+=pz;cr+=real[i];CP.push(cp);CR.push(cr);}
  const ab=cr-cp,gi=cr/cp*100;const days=[...Array(n).keys()].map(x=>x+1);
  return{
    text:`<p>Programul unei secții prevede <b>${pz} buc/zi</b> pe 10 zile. Realizările zilnice au fost:</p>${tbl(["Ziua",...days],[["Realizat (buc)",...real]],"small")}
    <p>Completați graficul Gantt tabelar cumulativ pentru ziua 10 și interpretați abaterea.</p>`,
    fields:[{label:"Programat cumulat la ziua 10",ans:cp},{label:"Realizat cumulat la ziua 10",ans:cr},{label:"Abaterea (realizat − programat)",ans:ab},{label:"Grad de îndeplinire (%, 1 zecimală)",ans:gi,dec:1,tolAbs:0.15}],
    sol:`${tbl(["Ziua",...days],[["P cumulat",...CP],["R cumulat",...CR]],"small")}<p>Abatere = ${cr} − ${cp} = <b>${ab}</b> buc; grad de îndeplinire = ${cr} / ${cp} × 100 ≈ <b>${nf(gi,1)}%</b>. Graficul cumulativ arată tendința: dacă diferența crește zi de zi, problema nu e accidentală și cere măsuri corective, nu doar consemnare în caietul dispecerului.</p>`
  };
},

/* ---------- MODUL 9: priorități Pr = Tf − D devansare ---------- */
prioritati(seed){
  const R=mkR(seed);const Tf=R.i(40,70);let dv;for(;;){dv=uniq(4,5,35,R);break;}const P=dv.map(x=>Tf-x);const names=["R1","R2","R3","R4"];const first=P.indexOf(Math.min(...P));
  return{
    text:`<p>Produsul are termenul final de fabricație <b>Tf = ziua ${Tf}</b>. Pentru patru repere s-au calculat duratele devansării (zile):</p>${tbl(["Reper",...names],[["D devansare",...dv]])}
    <p>Calculați prioritatea <b>Pr = Tf − D devansare</b> (ziua la care reperul trebuie lansat) și stabiliți reperul care se lansează primul.</p>`,
    fields:[...names.map((n,k)=>({label:`Pr ${n}`,ans:P[k],short:true})),{label:"Reperul lansat primul",type:"select",options:names,ans:first}],
    sol:`${tbl(["Reper","Calcul","Pr"],names.map((n,k)=>[n,`${Tf} − ${dv[k]}`,P[k]]))}<p>Reperul cu devansarea cea mai mare are prioritatea cea mai mică ca valoare, deci se lansează primul: <b>${names[first]}</b>.</p>`
  };
},

/* ---------- MODUL 10: indicatori de eficiență ---------- */
indicatori(seed){
  const R=mkR(seed);const Qp=R.i(80,200)*100,Qr=Math.round(Qp*R.i(85,108)/100),Cp=Math.round(Qp*R.i(105,130)/100/100)*100,Td=R.pick([1760,1840,1920]),Tl=Math.round(Td*R.i(72,96)/100);
  const k1=Qr/Qp*100,k2=Qr/Cp*100,k3=Tl/Td*100;
  return{
    text:`<p>O secție a programat <b>${nf(Qp)} buc</b> și a realizat <b>${nf(Qr)} buc</b>. Capacitatea de producție este <b>${nf(Cp)} buc</b>. Un utilaj a avut un fond de timp disponibil programat de <b>${nf(Td)} ore</b> și a lucrat efectiv <b>${nf(Tl)} ore</b>.</p><p>Calculați, ca raport realizat/bază × 100:</p>`,
    fields:[{label:"Coeficientul îndeplinirii programului (%)",ans:k1,dec:1,tolAbs:0.15},{label:"Indicatorul folosirii capacității (%)",ans:k2,dec:1,tolAbs:0.15},{label:"Folosirea fondului de timp disponibil (%)",ans:k3,dec:1,tolAbs:0.15}],
    sol:`<p>Îndeplinirea programului = ${nf(Qr)} / ${nf(Qp)} × 100 ≈ <b>${nf(k1,1)}%</b>.</p><p>Folosirea capacității = ${nf(Qr)} / ${nf(Cp)} × 100 ≈ <b>${nf(k2,1)}%</b>.</p><p>Folosirea fondului de timp = ${nf(Tl)} / ${nf(Td)} × 100 ≈ <b>${nf(k3,1)}%</b>.</p><p>Un program îndeplinit peste 100% nu e automat un succes: poate însemna stocuri inutile sau un program subdimensionat.</p>`
  };
},

/* ---------- MODUL 10: coeficientul de ritmicitate ---------- */
ritm(seed){
  const R=mkR(seed);const qp=[0,1,2].map(()=>R.i(20,40)*10);const qr=qp.map(x=>Math.max(0,x+R.i(-8,6)*10));
  const sp=qp.reduce((a,b)=>a+b,0),sm=qp.reduce((a,x,i)=>a+Math.min(x,qr[i]),0),sr=qr.reduce((a,b)=>a+b,0);const kr=sm/sp*100,ki=sr/sp*100;
  return{
    text:`<p>Programul lunar al unei linii este împărțit pe decade:</p>${tbl(["Decada","I","II","III"],[["Programat",...qp],["Realizat",...qr]])}
    <p>Calculați coeficientul de ritmicitate <b>Kr = Σ min(Realizat, Programat) / Σ Programat × 100</b> (producția peste program dintr-o decadă nu compensează lipsa din alta) și coeficientul de îndeplinire a programului lunar.</p>`,
    fields:[{label:"Kr (%, 1 zecimală)",ans:kr,dec:1,tolAbs:0.15},{label:"Îndeplinirea programului lunar (%, 1 zecimală)",ans:ki,dec:1,tolAbs:0.15}],
    sol:`<p>Σ min = ${qp.map((x,i)=>Math.min(x,qr[i])).join(" + ")} = ${sm}; Σ programat = ${sp}. Kr = ${sm} / ${sp} × 100 ≈ <b>${nf(kr,1)}%</b>.</p><p>Îndeplinire = ${sr} / ${sp} × 100 ≈ <b>${nf(ki,1)}%</b>.</p><p>${ki>kr?"Programul pe lună arată mai bine decât ritmicitatea: s-a lucrat în salturi, nu uniform.":"Cele două valori sunt apropiate: producția a urmat programul pe decade."}</p>`
  };
}
};
