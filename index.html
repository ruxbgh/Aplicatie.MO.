{id:"q9",type:"mcq",q:"Ce cuprinde etapa de programare din activitățile de procesare?",opts:["Programarea propriu-zisă, lansarea și controlul","Doar elaborarea bugetului anual","Recrutarea și instruirea personalului","Proiectarea produsului și testarea pieței"],a:0,ex:"Ca să produci trebuie să știi ce faci (programarea propriu-zisă), să pornești efectiv lucrul cu documentele necesare (lansarea) și să verifici dacă merge cum ai stabilit (controlul). Fără lansare programul rămâne pe hârtie; fără control nu știi dacă a funcționat."},
{id:"q10",type:"mcq",q:"Previziunea, ca responsabilitate a managerului operațional, înseamnă:",opts:["predicția cererii pentru produsele firmei pe baza informațiilor din trecut","stabilirea prețurilor de vânzare","negocierea cu sindicatele","alegerea furnizorilor de utilaje"],a:0,ex:"Previziunea nu e ghicit, ci extrapolarea datelor: dacă cererea de înghețată a crescut în fiecare iunie din ultimii trei ani, te aștepți să crească și anul acesta. Managerul operațional are nevoie de estimare ca să pregătească din timp materiale, oameni și capacitate."},
{id:"c1",type:"mcq",case:true,ctx:"La o fabrică de mobilă, furnizorul de PAL anunță o întârziere de trei zile. Comenzile programate pentru această săptămână folosesc toate PAL, cu excepția a două comenzi de mese din lemn masiv.",q:"Care este reacția corectă a managerului operațional?",opts:["Reprogramează: avansează comenzile din lemn masiv și mută comenzile cu PAL după sosirea materialului","Oprește fabrica până sosește PAL-ul, pentru a respecta programul inițial","Lasă programul neschimbat și înregistrează întârzierea la final de lună","Anulează comenzile care folosesc PAL"],a:0,ex:"Capacitatea care stă trei zile nefolosită e pierdută definitiv; orele acelea nu se recuperează. Avansând comenzile pentru care ai material, folosești timpul, iar comenzile cu PAL se fac după sosirea lui. Oprirea fabricii sau anularea comenzilor ar transforma o problemă de trei zile într-una mult mai mare."},
{id:"c2",type:"mcq",case:true,ctx:"Într-un atelier, cel mai experimentat tâmplar a fost mutat la ambalarea cutiilor, iar doi angajați noi lucrează la piesele sculptate.",q:"Ce direcție de folosire rațională a resurselor este încălcată?",opts:["Folosirea superioară a forței de muncă","Folosirea eficientă a capacităților de producție","Utilizarea maximă a bazei de materii prime","Dimensionarea riguroasă a stocurilor"],a:0,ex:"Un tâmplar experimentat la ambalare înseamnă un salariu mare pe o muncă simplă, iar începătorii la sculptură înseamnă rebuturi și timp pierdut. Problema e potrivirea omului cu sarcina, deci folosirea forței de muncă; utilajele și materia primă nu sunt afectate direct."},
{id:"k1",type:"classify",q:"O fabrică de lactate. Clasificați fiecare element ca variabilă a MO.",cats:["Variabilă de intrare","Variabilă de ieșire","Variabilă perturbatoare"],rows:[["Laptele crud de la ferme",0],["Iaurtul ambalat livrat la magazin",1],["Defectarea liniei de îmbuteliere",2],["Operatorii din schimbul de noapte",0],["Greva transportatorilor",2],["Brânza maturată gata de vânzare",1]],ex:"Întreabă-te: intră în proces, iese din proces sau îl deranjează? Laptele și operatorii sunt resurse consumate (intrări). Iaurtul și brânza sunt rezultatul (ieșiri). Defectarea liniei și greva nu sunt planificate și deviază procesul (perturbatoare)."},
{id:"k2",type:"classify",q:"Clasificați obiectivele managementului operațional.",cats:["Fundamental","Principal","Derivat"],rows:[["Supraviețuirea și profitabilitatea firmei",0],["Ritmicitatea producției",1],["Reducerea costurilor",2],["Satisfacția clienților",2],["Calitatea producției",1]],ex:"Ierarhia merge de la scop la mijloace. Firma vrea să existe și să câștige (fundamental). Pentru asta producția trebuie să curgă regulat și să fie bună (principal). Din asta decurg efecte măsurabile: costuri mai mici și clienți mulțumiți (derivat)."},
{id:"o1",type:"order",q:"Ordonați nivelurile managementului de la direcția de ansamblu spre execuția zilnică.",steps:["Management strategic","Management tactic","Management operativ"],ex:"Fiecare nivel îl concretizează pe cel de deasupra: direcția devine planuri pe termen mediu, iar planurile devin sarcini zilnice. În ordine inversă ai executa fără să știi spre ce te îndrepți."}
]},
/* ================= 2 ================= */
{id:"m2",nr:2,title:"Strategia operațională de producție",src:"Curs 3, Cap. 2",
key:["Strategia de business spune unde vrem să ajungem; strategia operațională spune cum producem ca să ajungem acolo.",
"Elemente centrale: misiunea, competența distinctivă, obiectivele operaționale, politicile operaționale.",
"Formularea pornește de la analiza mediului extern și intern; procesul este circular, cu feedback din rezultate.",
"Două tipuri: strategia celui care imită (piețe mature, cost) și strategia inovatorului (piețe în dezvoltare, flexibilitate).",
"O firmă trebuie să aleagă o competență principală; McDonald’s 2013–2015 arată ce se întâmplă când încerci să fii bun la toate."],
items:[
{id:"q1",type:"mcq",q:"Care este diferența dintre strategia de business și strategia operațională?",opts:["Prima stabilește unde vrem să ajungem, a doua cum producem pentru a ajunge acolo","Prima este pe termen scurt, a doua pe termen lung","Prima privește doar producția, a doua doar vânzările","Nu există diferență, sunt sinonime"],a:0,ex:"Strategia de business e destinația („vrem să fim cel mai accesibil brand de mobilă”). Strategia operațională e motorul („producem în serii mari, din materiale standard, cu ambalare plată”). Prima spune ce vrei, a doua cum face fabrica acest lucru posibil."},
{id:"q2",type:"mcq",q:"Competența distinctivă reprezintă:",opts:["domeniul în care firma poate excela în funcțiunea de producție","lista tuturor produselor firmei","nivelul de calificare al managerului general","bugetul alocat cercetării"],a:0,ex:"Ca la un sportiv: poate practica mai multe sporturi, dar câștigă la unul. Competența distinctivă e lucrul pe care fabrica îl face mai bine decât concurenții: cost, calitate, flexibilitate sau viteză. O listă de produse sau un buget nu spun la ce excelezi."},
{id:"q3",type:"mcq",q:"Politicile operaționale arată:",opts:["cum vor fi îndeplinite obiectivele, prin decizii și reguli concrete","ce își dorește organizația pe termen lung","care sunt concurenții principali","ce venituri estimează firma"],a:0,ex:"Obiectivul spune unde vrei să ajungi („livrăm în 48 de ore”); politica e regula concretă care te duce acolo („ținem stoc de siguranță pentru cele 20 de produse cele mai vândute”). Fără politici, obiectivele rămân dorințe."},
{id:"q4",type:"mcq",q:"Strategia celui care imită este specifică:",opts:["piețelor mature, sensibile la preț, cu produse standardizate","piețelor în dezvoltare, cu cerere instabilă","firmelor care lansează des produse radical noi","exclusiv sectorului public"],a:0,ex:"Pe o piață matură produsele seamănă, iar clientul alege după preț. Cine imită nu câștigă prin noutate, ci prin eficiență: procese standard, volume mari, cost unitar mic."},
{id:"q5",type:"mcq",q:"Strategia inovatorului pune accent în primul rând pe:",opts:["flexibilitate și lansarea rapidă de produse noi","reducerea costului unitar cu orice preț","menținerea aceluiași produs cât mai mult","eliminarea cercetării-dezvoltării"],a:0,ex:"Pe o piață nouă nimeni nu știe exact ce vor clienții, iar produsele se schimbă repede. Câștigă cine se adaptează și lansează rapid variante noi; costul unitar contează mai puțin când produsul de anul trecut e deja depășit."},
{id:"q7",type:"mcq",q:"Ce înseamnă „nearshoring”?",opts:["Mutarea producției mai aproape de piețele de desfacere","Externalizarea producției în Asia","Producția exclusiv pe comandă","Închiderea fabricilor din zonele de coastă"],a:0,ex:"„Near” înseamnă aproape. După blocajele din lanțurile de aprovizionare, multe firme au văzut că un cost mic în Asia nu valorează mult dacă marfa ajunge cu luni de întârziere. Produci puțin mai scump, dar aproape de clienți, deci livrezi repede și sigur."},
{id:"q8",type:"mcq",q:"Un „digital twin” permite:",opts:["testarea scenariilor într-o replică virtuală a fabricii înainte de aplicarea lor în realitate","dublarea automată a capacității de producție","angajarea a doi operatori pe același post","stocarea produselor într-un depozit virtual"],a:0,ex:"E un simulator de zbor pentru fabrică: încerci o nouă așezare a utilajelor sau alt program de lucru pe modelul virtual și vezi efectele fără să riști producția reală. Nu adaugă capacitate și nu e un depozit, ci un instrument de testare."},
{id:"c1",type:"mcq",case:true,ctx:"O brutărie artizanală din Ploiești vrea, în același timp, cele mai mici prețuri din oraș, produse premium cu maia naturală și livrare în 30 de minute oriunde în județ.",q:"Ce i-ai recomanda?",opts:["Să aleagă o competență distinctivă și să-și construiască procesele în jurul ei","Să urmărească toate trei obiectivele cu aceeași prioritate","Să renunțe la orice strategie și să reacționeze la cerere","Să copieze strategia celui mai mare concurent"],a:0,ex:"Prețul minim cere standardizare, maiaua naturală cere timp și meșteșug, livrarea în 30 de minute în tot județul cere logistică scumpă. Cele trei trag procesele în direcții opuse, așa că o brutărie mică trebuie să aleagă un lucru la care să fie cea mai bună."},
{id:"c2",type:"mcq",case:true,ctx:"Un producător de piese auto din Pitești a rămas fără cipuri timp de două luni, pentru că avea un singur furnizor din Asia.",q:"Ce factor extern a fost neglijat în strategia operațională?",opts:["Materiile prime: disponibilitatea și dependența de surse externe","Nevoile consumatorilor","Cultura organizațională","Abilitățile forței de muncă"],a:0,ex:"Dependența de un singur furnizor îndepărtat e un risc din afara firmei: disponibilitatea materiilor prime. Cultura și abilitățile oamenilor țin de interior, iar problema nu a fost cererea, ci aprovizionarea."},
{id:"k2",type:"classify",q:"Încadrați fiecare factor în analiza mediului.",cats:["Mediu extern","Mediu intern"],rows:[["Concurența",0],["Cultura organizațională",1],["Inflația",0],["Abilitățile forței de muncă",1],["Disponibilitatea resurselor",1],["Fluctuația cursului valutar",0],["Noile tehnologii",0]],ex:"Test simplu: poate firma schimba factorul prin propria decizie? Cultura, abilitățile oamenilor și resursele proprii, da (intern). Concurența, inflația, cursul valutar și noile tehnologii apar indiferent ce decide firma (extern)."},
{id:"k3",type:"classify",q:"O fabrică de mobilier. Ce element al strategiei operaționale reprezintă fiecare enunț?",cats:["Misiune","Competență distinctivă","Obiectiv operațional","Politică operațională"],rows:[["„Oferim mobilier funcțional la cel mai bun preț de pe piață.”",0],["„Ne reconfigurăm liniile mai repede decât orice concurent.”",1],["„Reducem rebuturile cu 15% până în decembrie.”",2],["„Gestionăm stocurile de componente prin Kanban.”",3]],ex:"Misiunea răspunde la „de ce existăm”, competența la „la ce suntem cei mai buni”, obiectivul la „ce cifră atingem și până când”, politica la „după ce regulă lucrăm”. Indiciu: dacă are număr și termen, e obiectiv; dacă descrie o metodă de lucru, e politică."},
{id:"o1",type:"order",q:"Ordonați pașii metodei de formulare a strategiei operaționale.",steps:["Misiunea funcțiunii de producție","Competența distinctivă","Obiectivele operaționale","Politicile operaționale"],ex:"Mergi de la general la concret: rolul producției, apoi ce faci excepțional, apoi ținte măsurabile, iar la final regulile de lucru. Dacă începi cu politicile, riști procese foarte bune pentru un scop greșit."}
]},
/* ================= 3 ================= */
{id:"m3",nr:3,title:"Programarea: planificarea agregat și ordonanțarea",src:"Curs 5, Cap. 3.1",
key:["Previziunea are trei etape: prognoză, planificare, programare.",
"Planul agregat (3–18 luni) pune în balanță capacitatea și cererea, la cost minim.",
"Strategii pure: urmărirea cererii (supramuncă/inactivitate sau angajări/demiteri) și producție constantă egală cu cererea medie.",
"Programul calendaristic centralizator (MPS) detaliază planul pe produse, cantități, priorități, termene și valoare.",
"Ordonanțarea folosește reguli de prioritate, mărimi numerice de prioritate, algoritmi optimi și euristici."],
items:[
{id:"q1",type:"mcq",q:"Care este ordinea etapelor previziunii, după orizontul de timp?",opts:["Prognoză, planificare, programare","Programare, planificare, prognoză","Planificare, prognoză, programare","Prognoză, programare, planificare"],a:0,ex:"Întâi estimezi ce se va cere (prognoza), apoi decizi cu ce resurse răspunzi (planificarea), apoi fixezi exact cine, ce și când produce (programarea). Fiecare etapă folosește rezultatul celei dinainte și coboară spre un orizont mai scurt."},
{id:"q2",type:"mcq",q:"Ce orizont acoperă planificarea agregat?",opts:["Între 3 și 18 luni","Între 1 și 8 săptămâni","O singură zi de lucru","Între 5 și 10 ani"],a:0,ex:"Sub 3 luni nu mai ai timp să angajezi sau să construiești stocuri, iar peste un an și jumătate cererea e prea incertă. În intervalul intermediar încă poți ajusta forța de muncă, stocurile și subcontractarea."},
{id:"q3",type:"mcq",q:"Ce urmărește planificarea agregat?",opts:["Să pună în balanță capacitatea de producție și cererea, astfel încât costurile să fie minime","Să stabilească ordinea operațiilor pe fiecare utilaj","Să calculeze necesarul de șuruburi","Să fixeze salariile angajaților"],a:0,ex:"„Agregat” înseamnă că nu te uiți la fiecare produs, ci la total: câte ore de muncă sau unități echivalente îți trebuie lunar. Întrebarea e cum acoperi variațiile cererii cu capacitatea, la cost minim. Ordinea pe utilaje și necesarul de șuruburi vin mult mai târziu."},
{id:"q4",type:"mcq",q:"În strategia de urmărire a cererii, producția programată este:",opts:["egală cu cererea estimată din fiecare perioadă","egală cu cererea medie pe an","egală cu capacitatea maximă","zero în perioadele cu cerere mică"],a:0,ex:"Producția urmărește cererea ca o umbră: crește când crește cererea (ore suplimentare sau angajări) și scade când ea scade. Avantajul: aproape fără stocuri. Dezavantajul: costuri cu personalul care variază mult."},
{id:"q5",type:"mcq",q:"De ce este planificarea agregat mai delicată în servicii?",opts:["Serviciile nu pot fi stocate și sunt perisabile","Serviciile nu au cerere sezonieră","Serviciile nu au costuri de personal","Serviciile nu pot fi planificate"],a:0,ex:"Un produs fizic făcut în februarie se poate vinde în martie. Un loc în avion sau o oră de consultanță nefolosită azi dispare. Fără posibilitatea de a stoca, serviciile trebuie să potrivească capacitatea cu cererea aproape în timp real."},
{id:"q6",type:"mcq",q:"Cum sunt folosite de obicei pârghiile când cererea crește semnificativ?",opts:["Mai întâi supramunca, apoi reducerea stocurilor și angajarea de lucrători","Mai întâi concedieri, apoi supramuncă","Doar subcontractare","Creșterea prețurilor pentru a reduce cererea"],a:0,ex:"Ordinea urmează costul și ușurința de a reveni: orele suplimentare se pornesc și se opresc imediat, stocurile se folosesc rapid, iar angajările costă și durează. Începi cu pârghiile ieftine și flexibile, apoi treci la cele greu de anulat."},
{id:"q7",type:"mcq",q:"Modelul problemei de repartizare (afectare) presupune:",opts:["formarea de perechi executant–lucrare, fiecare lucrare unui singur executant","împărțirea unei sarcini între mai mulți executanți","alocarea materiilor prime pe depozite","stabilirea prețului fiecărei lucrări"],a:0,ex:"Ca la posturile dintr-o echipă: fiecare jucător pe un singur post, fiecare post ocupat de un singur jucător. Dacă o sarcină s-ar putea împărți între mai mulți executanți, ar fi o problemă de distribuire, nu de repartizare."},
{id:"q8",type:"mcq",q:"Dacă obiectivul principal este respectarea termenelor, ce regulă locală de prioritate este potrivită?",opts:["Produsul cu cea mai mică rezervă de timp","Primul sosit, primul servit","Oricare produs","Produsul cu cea mai mare valoare"],a:0,ex:"Rezerva arată cât poate aștepta o comandă fără să rateze termenul. Comanda cu rezerva cea mai mică e cea mai expusă, deci o iei prima. „Primul sosit, primul servit” e corect față de ordinea sosirii, dar ignoră termenele."},
{id:"q9",type:"mcq",q:"Aplicarea multiplicativă a regulilor de prioritate înseamnă:",opts:["respectarea concomitentă a două reguli, de exemplu importanța clientului și rezerva de timp","aplicarea unei a doua reguli doar la egalitate după prima","aplicarea unei singure reguli simple","dublarea priorității tuturor comenzilor"],a:0,ex:"Multiplicativ înseamnă că ambele criterii contează simultan, ca un clasament calculat din notele la două probe. În varianta aditivă, a doua regulă intervine doar ca departajare la egalitate."},
{id:"q10",type:"mcq",q:"Când sunt preferați algoritmii euristici în locul celor optimi?",opts:["Când problema e prea complexă pentru soluția exactă și e nevoie de un rezultat bun, rapid","Când avem doar două lucrări","Când costul calculului nu contează","Niciodată, algoritmii optimi sunt mereu mai buni"],a:0,ex:"Pentru 10 comenzi există peste 3,6 milioane de ordini posibile; la 20 de comenzi numărul devine astronomic. Euristica renunță la garanția optimului ca să dea în câteva secunde o soluție suficient de bună."},
{id:"q11",type:"mcq",q:"Programul calendaristic centralizator (MPS) NU conține, pentru fiecare perioadă:",opts:["fișele de post ale muncitorilor","cantitățile programate din fiecare produs","termenele de livrare","valoarea producției marfă programate"],a:0,ex:"Programul centralizator răspunde la întrebarea „ce, cât și până când produce fabrica”: produse, cantități, priorități, termene, valoare. Fișele de post descriu oamenii, nu programul de producție."},
{id:"k1",type:"classify",q:"Clasificați opțiunile de echilibrare a cererii cu capacitatea.",cats:["Influențează cererea","Ajustează capacitatea"],rows:[["Prețuri reduse la matineu",0],["Ore suplimentare",1],["Amânarea livrării comenzilor",0],["Muncă sezonieră",1],["Barul pentru clienții care așteaptă masa",0],["Subcontractarea comenzilor",1],["Stocuri create în perioade slabe",1],["Campanie de promovare",0]],ex:"Întrebarea-cheie: modifici comportamentul clientului sau capacitatea ta? Prețul, promovarea, amânarea și barul pentru clienții care așteaptă schimbă când și cât cer clienții. Orele suplimentare, munca sezonieră, stocurile și subcontractarea schimbă cât poți produce."},
{id:"o1",type:"order",q:"Ordonați etapele planificării, de la termen lung la termen scurt.",steps:["Planificarea strategică","Planificarea agregat","Planificarea master a producției","Planificarea necesarului de materiale (MRP)","Programarea detaliată"],ex:"Mergi de la familii de produse pe ani la operații pe ore: strategia dă direcția, planul agregat volumele lunare, planul master produsele pe săptămâni, MRP componentele, iar programarea detaliată fiecare operație."},
{id:"g1",type:"calc",gen:"agregat",title:"Planificare agregat: trei strategii pure"},
{id:"g2",type:"calc",gen:"spt",title:"Regula SPT"},
{id:"g3",type:"calc",gen:"slack",title:"Regula rezervei minime de timp"},
{id:"g4",type:"calc",gen:"indice",title:"Indicele de prioritate al comenzilor"},
{id:"g5",type:"calc",gen:"repartizare",title:"Problema de repartizare"}
]},
/* ================= 4 ================= */
{id:"m4",nr:4,title:"Metoda MRP",src:"Curs 9, MRP, Cap. 3.1",
key:["MRP răspunde la trei întrebări: de ce este nevoie, cât și când.",
"Cererea independentă (produse finite) se previzionează; cererea dependentă (componente) se calculează exact.",
"Intrări: programul master de producție (PMP, 40–50 săptămâni), lista de repere (BOM), înregistrările de inventar.",
"CN = CB − (D − SS) − RP; D(i+1) = D(i) + RP(i) − CB(i) + CN(i); lansarea se face cu Te perioade înainte de recepție.",
"Evoluție: MRP → MRP I → MRP II → ERP. MRP clasic nu include programarea capacității."],
items:[
{id:"q1",type:"mcq",q:"La ce trei întrebări răspunde MRP?",opts:["De ce este nevoie? Cât? Când?","Cine produce? Unde? Cu ce cost?","Ce vindem? Cui? La ce preț?","Cât costă? Cine plătește? Când?"],a:0,ex:"Ca o rețetă pentru 50 de prăjituri: ce ingrediente îți trebuie, câte din fiecare și când le cumperi ca să fie în cămară la timp. MRP face același lucru pentru mii de piese, pornind de la produsele finite programate."},
{id:"q2",type:"mcq",q:"Ce limită avea sistemul MRP clasic?",opts:["Nu includea programarea capacității","Nu calcula cantitățile de piese","Nu folosea programul master","Nu putea fi informatizat"],a:0,ex:"MRP calculează necesarul ca și cum fabrica ar putea produce orice cantitate, oricând. În realitate, planul poate cere 300 de ore de strung într-o săptămână cu 160 disponibile. De aceea versiunile ulterioare au adăugat verificarea capacității."},
{id:"q3",type:"mcq",q:"Din ce s-a născut conceptul MRP II?",opts:["Din evidențierea celor două tipuri de nevoi: independente și dependente","Din apariția internetului","Din renunțarea la listele de materiale","Din cerințele contabilității"],a:0,ex:"Unele cereri vin din piață și trebuie estimate (câte biciclete cumpără clienții); altele se calculează exact din primele (fiecare bicicletă are 2 roți). Odată făcută distincția, nu mai previzionezi roțile separat, ci le calculezi. Pe acest principiu s-a construit tot sistemul."},
{id:"q4",type:"mcq",q:"Programul master de producție (PMP) provine din:",opts:["descompunerea planului agregat în produse concrete, pe 40–50 de săptămâni","lista furnizorilor","bugetul de marketing","registrul de personal"],a:0,ex:"Planul agregat vorbește în totaluri („10.000 de unități de mobilier în martie”); planul master spune concret „400 de mese model X în săptămâna 12”. Abia cu produse concrete poți calcula componentele, iar orizontul lung lasă timp pentru aprovizionare."},
{id:"q5",type:"mcq",q:"Lista de repere (BOM) conține:",opts:["reperele și subansamblele, cantitățile din fiecare și secvența în care se combină","prețurile de vânzare ale produselor","programul de lucru al muncitorilor","clienții care au comandat produsul"],a:0,ex:"E rețeta produsului: ce intră în el, în ce cantitate și în ce ordine se asamblează. Fără ea nu poți trece de la „100 de biciclete” la „200 de roți și 3.600 de spițe”. Prețurile și clienții nu fac parte din structura produsului."},
{id:"q7",type:"mcq",q:"Lansarea programată în fabricație (LPF) se plasează:",opts:["cu Te perioade înaintea recepției planificate","în aceeași perioadă cu recepția","după recepția planificată","la începutul anului, indiferent de Te"],a:0,ex:"Dacă o piesă se face în 2 săptămâni și îți trebuie în săptămâna 5, o lansezi în săptămâna 3. Ca la o pizza comandată pentru ora 20, când știi că livrarea durează 45 de minute."},
{id:"k1",type:"classify",q:"Tipul cererii pentru fiecare articol.",cats:["Cerere independentă","Cerere dependentă"],rows:[["Automobilele vândute dealerilor",0],["Plăcuțele de frână pentru mașinile din PMP",1],["Laptopurile vândute online",0],["Șuruburile pentru scaunele programate",1],["Scaunele de birou comandate de un client",0],["Tabla pentru carcasele de produs",1]],ex:"Dacă cererea vine direct de la un client, e independentă și trebuie estimată. Dacă articolul e o componentă a unui produs deja programat, cantitatea rezultă din calcul, deci e dependentă: plăcuțele de frână depind de numărul de mașini din program."},
{id:"k2",type:"classify",q:"Avantaj sau dezavantaj al unui sistem MRP?",cats:["Avantaj","Dezavantaj"],rows:[["Reducerea stocurilor de producție neterminată",0],["Costurile de pregătire a listelor de materiale",1],["Reducerea timpilor morți",0],["Taxele de consultanță și formare",1],["Răspuns rapid la schimbarea strategiei",0]],ex:"Avantajele țin de ce câștigi când știi exact ce și când îți trebuie: stocuri mai mici, mai puțin timp pierdut, reacție rapidă. Dezavantajele țin de ce costă să ajungi acolo: date corecte, software, oameni pregătiți."},
{id:"o1",type:"order",q:"Ordonați evoluția sistemelor de planificare.",steps:["MRP","MRP I","MRP II","ERP"],ex:"Fiecare etapă lărgește aria celei dinainte: întâi materialele, apoi controlul producției și al capacităților, apoi toate resursele de fabricație, iar în final întreaga firmă (financiar, vânzări, personal)."},
{id:"g1",type:"calc",gen:"mrp",title:"Registrul MRP: CN și lansări"},
{id:"g2",type:"calc",gen:"bom",title:"Explozia listei de materiale"}
]},
/* ================= 5 ================= */
{id:"m5",nr:5,title:"Organizarea",src:"Curs 6, Cap. 4.1",
key:["Organizarea răspunde la întrebarea „cum facem efectiv ce s-a planificat?”.",
"Baza organizării: tipul de producție; apoi procesul tehnologic; în vârf, produsul finit.",
"Convențional-continuu: z = f(w, s); convențional-discontinuu: z = f(w, d).",
"Tipul de producție se determină la nivel de reper-operație sau verigă, după numărul de obiecte-operație No.",
"Nomenclatura largă duce la descentralizare; producția pe comenzi grupează utilajele pe tipuri, fluxul le așază pe linii."],
items:[
{id:"q1",type:"mcq",q:"La ce întrebare răspunde organizarea, ca funcție a MO?",opts:["Cum se realizează efectiv ceea ce s-a planificat?","Ce produse vom vinde peste 10 ani?","Cât costă un produs?","Cine sunt concurenții?"],a:0,ex:"Programarea spune ce și când. Organizarea răspunde la cum: cine face, cu ce utilaje, în ce ordine și pe ce drum circulă materialele. Un program excelent eșuează într-o hală organizată haotic."},
{id:"q2",type:"mcq",q:"În formula procesului convențional-continuu z = f(w, s), ce reprezintă s?",opts:["Stocurile de producție neterminată aflate permanent în prelucrare","Salariul mediu","Numărul de schimburi","Suprafața halei"],a:0,ex:"Într-un proces continuu (rafinărie, ciment) materialul e mereu în curgere. Ca să ai produs la ieșire la momentul dorit, trebuie să existe permanent o cantitate în curs de prelucrare. De aceea momentul lansării depinde de termen și de acest stoc."},
{id:"q3",type:"mcq",q:"Un proces convențional-discontinuu se caracterizează prin:",opts:["producție în loturi, cu pauze între operații sau comenzi","flux neîntrerupt și automatizat","cost unitar minim și flexibilitate redusă","absența oricărei planificări"],a:0,ex:"Ca într-o croitorie: lucrezi un lot de sacouri, apoi schimbi tiparele și treci la pantaloni. Între loturi apar pauze și reglaje. Câștigi flexibilitate, dar pierzi din eficiența unui flux neîntrerupt."},
{id:"q4",type:"mcq",q:"La ce nivel se recomandă determinarea tipului de producție?",opts:["La nivel de reper-operație sau de verigă de producție","Doar la nivelul întregii fabrici","La nivelul departamentului de vânzări","La nivelul grupului de firme"],a:0,ex:"Aceeași fabrică poate avea o linie de montaj în flux și un atelier unde fiecare piesă e unicat. Dacă ai eticheta toată fabrica cu un singur tip, ai organiza greșit cel puțin una dintre zone."},
{id:"q5",type:"mcq",q:"Care este criteriul principal pentru aprecierea cantitativă a tipului de producție?",opts:["Numărul de obiecte-operație (No) executate la un loc de muncă","Numărul de angajați","Cifra de afaceri","Suprafața de producție"],a:0,ex:"No arată câte lucruri diferite face un loc de muncă. Un strung care face toată ziua o singură operație e foarte specializat; unul care face 30 de operații diferite trebuie reglat mereu. Numărul de angajați sau cifra de afaceri nu spun nimic despre specializare."},
{id:"q6",type:"mcq",q:"Cum influențează o nomenclatură de fabricație foarte variată managementul operațional?",opts:["Determină o descentralizare a muncii de MO la nivelul secțiilor, atelierelor și locurilor de muncă","Impune centralizarea tuturor deciziilor","Elimină nevoia de coordonare","Nu are nicio influență"],a:0,ex:"Când fiecare comandă e diferită, cel mai bine știe cum se face omul din atelier, nu un birou central. Deciziile coboară acolo unde sunt informația și experiența. Pe o linie auto standardizată, centralizarea funcționează pentru că totul e previzibil."},
{id:"q7",type:"mcq",q:"În producția pe comenzi individuale, utilajele se amplasează de regulă:",opts:["pe grupe de mașini de același tip","pe o bandă rulantă unică","în ordinea strictă a operațiilor pe o linie","aleatoriu"],a:0,ex:"Când piesele sunt mereu altele, fiecare are alt traseu prin hală. Cu toate strungurile într-o zonă și toate frezele în alta, orice piesă își găsește drumul. O linie fixă are sens doar când toate produsele trec prin aceleași operații în aceeași ordine."},
{id:"c1",type:"mcq",case:true,ctx:"Un atelier execută piese de schimb pentru utilaje vechi: fiecare comandă e diferită, iar la un strung s-au executat luna trecută 34 de obiecte-operație distincte.",q:"Ce tip de producție și ce organizare se potrivesc?",opts:["Producție individuală; organizare flexibilă, descentralizată, utilaje grupate pe tipuri","Producție de masă; linie automatizată în flux","Serie mare; bandă rulantă","Serie mijlocie; centralizare totală"],a:0,ex:"34 de operații distincte la un singur loc de muncă înseamnă că strungul face aproape mereu altceva: producție individuală. O linie în flux ar fi o risipă, cu utilaje reglate pentru operații care nu se mai repetă."},
{id:"k1",type:"classify",q:"Ce tip de proces tehnologic are fiecare industrie?",cats:["Convențional-continuu","Convențional-discontinuu"],rows:[["Rafinărie",0],["Fabrică de ciment",0],["Confecții textile",1],["Centrală electrică",0],["Fabrică de mobilă",1],["Confecții metalice",1]],ex:"Întreabă-te dacă procesul se poate opri ușor între produse. Rafinăria, cimentul și energia merg 24 de ore din 24, iar oprirea costă enorm (continuu). Textilele, mobila și confecțiile metalice lucrează pe loturi și comenzi (discontinuu)."},
{id:"k2",type:"classify",q:"Caracteristicile tipurilor de producție.",cats:["Masă","Serie","Individuală"],rows:[["Nomenclatură singulară sau foarte redusă",0],["Nomenclatură instabilă, variată",2],["Specializare deplină a locurilor de muncă",0],["Specializare imposibilă",2],["Durata ciclului depinde de loturi",1],["Durata ciclului minimă",0]],ex:"Cu cât produci mai mult din același lucru, cu atât poți specializa oamenii și utilajele și scurta ciclul (masă). Când fiecare produs e diferit, specializarea e imposibilă (individuală). Seria e la mijloc: lucrezi pe loturi, deci durata depinde de mărimea lor."},
{id:"g1",type:"calc",gen:"tipprod",title:"Tipul de producție după No"}
]},
/* ================= 6 ================= */
{id:"m6",nr:6,title:"Coordonarea: inventar, loturi, ciclul de producție",src:"Curs 7, Cap. 5.1",
key:["Lotul de fabricație: produse identice lansate simultan, prelucrate pe aceleași locuri de muncă, cu un singur timp de pregătire-încheiere.",
"Factorii pot cere mărirea, reducerea sau delimitarea mărimii lotului.",
"L₀ = √(2·D·Co/Ch); nL = N/L₀; R = T/nL.",
"Dcp = Tpi + Tteh + Tn + Tct + Ttr + Tîntr.",
"Stocurile de producție neterminată asigură continuitatea și ritmicitatea fabricației."],
items:[
{id:"q1",type:"mcq",q:"Lotul de fabricație este:",opts:["cantitatea de produse identice lansate simultan, prelucrate pe aceleași locuri de muncă, cu un singur timp de pregătire-încheiere","numărul total de produse fabricate într-un an","stocul de siguranță al unei piese","cantitatea comandată de un client"],a:0,ex:"Cuvântul-cheie este „un singur timp de pregătire-încheiere”: reglezi mașina o dată și produci toate bucățile identice. De aici vine avantajul lotului: costul reglajului se împarte la multe piese."},
{id:"q2",type:"mcq",q:"Care NU este un scop al inventarului?",opts:["Creșterea timpului de pregătire-încheiere","Menținerea independenței operaționale","Satisfacerea variației cererii","Flexibilitate în programarea producției"],a:0,ex:"Stocul e un tampon: o operație poate lucra chiar dacă cea dinainte s-a oprit, poți acoperi vârfuri de cerere și poți cumpăra în cantități avantajoase. Un timp de reglaj mai lung nu e un scop, ci un cost pe care încerci să-l reduci."},
{id:"q3",type:"mcq",q:"Criteriul economic de dimensionare a lotului urmărește:",opts:["mărimea care conduce la costul unitar minim","mărimea impusă de durata perioadei contabile","nivelul acceptabil al activelor circulante imobilizate","numărul strict de ore de funcționare a utilajului"],a:0,ex:"Ca la cumpărarea detergentului: dacă iei câte unul, mergi des la magazin (cost de lansare mare); dacă iei 50, îți umpli casa (cost de stocare mare). Criteriul economic caută cantitatea la care suma celor două costuri pe unitate e minimă."},
{id:"q4",type:"mcq",q:"Ce include timpul de pregătire-încheiere?",opts:["Emiterea documentației, reglarea utilajelor, piesele de probă, predarea lucrărilor","Doar timpul de prelucrare efectivă a piesei","Timpul de transport la client","Concediul de odihnă al muncitorilor"],a:0,ex:"Înainte de prima piesă bună trebuie pregătite documentele, reglat utilajul și verificate piesele de probă; la final, lucrarea se predă. Toate se fac o dată pe lot, indiferent dacă lotul are 10 sau 1.000 de piese."},
{id:"q5",type:"mcq",q:"Periodicitatea lansării loturilor în fabricație este:",opts:["intervalul de timp dintre două lansări consecutive","durata prelucrării unui lot","numărul de loturi pe an","timpul de transport între secții"],a:0,ex:"Dacă faci 20 de loturi în 250 de zile lucrătoare, pornești un lot nou la fiecare 12,5 zile. Periodicitatea e ritmul în care lansezi loturile, nu durata unui lot și nici numărul lor."},
{id:"q6",type:"mcq",q:"Ce efect economic are lotizarea fabricației?",opts:["Crește fondul de timp efectiv lucrat și scade volumul documentației de lansare","Crește costul unitar","Elimină nevoia de control","Crește numărul de reglaje"],a:0,ex:"Cu loturi reglezi mai rar, deci mașina lucrează mai mult și se pregătește mai puțin. Mai puține lansări înseamnă și mai puține documente de emis și urmărit. Toate aceste economii reduc costul pe bucată."},
{id:"q7",type:"mcq",q:"Care este o cale de reducere a duratei ciclului de producție?",opts:["Reducerea duratei întreruperilor interoperații","Creșterea stocului de producție neterminată","Mărirea timpului de pregătire-încheiere","Adăugarea de controale manuale suplimentare"],a:0,ex:"Într-o fabrică obișnuită, piesa stă mult mai mult în așteptare decât în prelucrare. E de obicei mai ușor și mai ieftin să tai din așteptări decât să faci operația mai rapidă. Celelalte variante lungesc ciclul."},
{id:"c1",type:"mcq",case:true,ctx:"Fabrimob produce mobilier la comandă. Prețurile la materiale cresc, iar cererea scade. Managementul vrea loturi mai mici.",q:"Care factor justifică reducerea lotului?",opts:["Reducerea imobilizărilor de capital în stocuri","Reducerea cheltuielilor de pregătire-încheiere pe unitatea de produs","Capacitatea mijloacelor de transport","Creșterea productivității prin serii lungi"],a:0,ex:"Când materialele se scumpesc și cererea scade, fiecare bucată din stoc blochează bani care s-ar putea să nu se întoarcă curând. Loturile mici reduc banii imobilizați. Reducerea reglajului pe bucată și seriile lungi ar cere loturi mai mari, deci direcția opusă."},
{id:"k1",type:"classify",q:"Clasificați factorii care influențează mărimea lotului.",cats:["Cer mărirea lotului","Cer reducerea lotului","Delimitează mărimea"],rows:[["Reducerea cheltuielilor de pregătire-încheiere pe unitate",0],["Reducerea ciclului de fabricație",1],["Durata de folosință a SDV-urilor între reascuțiri",2],["Folosirea rațională a capacităților",0],["Livrări la intervale mici, în cantități reduse",1],["Capacitatea mijloacelor de transport",2],["Reducerea imobilizărilor",1],["Capacitatea de producție a secției",2]],ex:"Unii factori împing spre loturi mari: vrei să împarți reglajul la cât mai multe piese. Alții trag spre loturi mici: nu vrei bani blocați sau cicluri lungi. Iar unii pun limite fizice: lotul nu poate depăși cât încape în camion sau cât rezistă scula până la reascuțire."},
{id:"k2",type:"classify",q:"Ce componentă a ciclului de producție este fiecare situație?",cats:["Tpi","Tteh","Tn","Tct","Ttr","Tîntr"],rows:[["Reglarea strungului înainte de lot",0],["Frezarea efectivă a piesei",1],["Uscarea vopselei timp de 24 de ore",2],["Verificarea cotelor cu șublerul",3],["Mutarea paletului la secția de montaj",4],["Piesele așteaptă eliberarea mașinii următoare",5]],ex:"Întreabă-te ce se întâmplă cu piesa în acel moment: se pregătește utilajul (Tpi), e prelucrată (Tteh), se desfășoară un proces natural fără intervenție (Tn), e verificată (Tct), e mutată (Ttr) sau doar așteaptă (Tîntr)."},
{id:"g1",type:"calc",gen:"eoq",title:"Lotul optim și periodicitatea"},
{id:"g2",type:"calc",gen:"costlot",title:"Lot mic sau lot mare?"},
{id:"g3",type:"calc",gen:"dcp",title:"Durata ciclului de producție"},
{id:"g4",type:"calc",gen:"period",title:"Numărul de loturi și periodicitatea"}
]},
/* ================= 7 ================= */
{id:"m7",nr:7,title:"Antrenarea și lansarea în fabricație",src:"Curs 8, Cap. 6.1",
key:["Antrenarea transmite, de la subiectul conducător la obiectul condus, sarcinile de fabricație.",
"Lansarea se află în avalul programării și în amontele controlului.",
"Documente: bonuri de consum, bonuri (dispoziții) de lucru, note de predare, borderoul documentelor de lansare.",
"Metode: pe bază de grafice, de devansări, de stoc, lansare grupată. Forme: centralizată și descentralizată.",
"Ordonanțare: regula NB (euristică) pentru un utilaj; algoritmul Johnson (optim) pentru două utilaje."],
items:[
{id:"q1",type:"mcq",q:"Ce înseamnă că lansarea în fabricație se situează „în avalul programării și în amontele controlului”?",opts:["Vine după programare și înaintea controlului","Vine înaintea programării și după control","Înlocuiește programarea și controlul","Are loc simultan cu programarea"],a:0,ex:"Aval înseamnă „după”, amonte „înainte”, ca la cursul unui râu. Întâi se face programul, apoi se pornește efectiv producția pe baza lui, apoi se controlează ce a ieșit."},
{id:"q2",type:"mcq",q:"Bonul de consum (de materiale) servește la:",opts:["eliberarea materialelor din magazie către producție","autorizarea execuției unei operații","transferul pieselor între secții","centralizarea tuturor documentelor"],a:0,ex:"Magazia nu dă materiale pe cuvânt: bonul arată ce, cât și pentru ce lot iese. Așa știi ulterior cât a costat lotul și dacă s-a consumat peste normă."},
{id:"q3",type:"mcq",q:"Devansarea calendaristică înseamnă:",opts:["începerea lucrării mai devreme decât în programul inițial, fără a modifica cantitățile","creșterea cantităților programate","amânarea lansării","eliminarea unei operații"],a:0,ex:"Știi că o etapă durează mult (o uscare de 48 de ore, un tratament termic), așa că începi mai devreme ca să termini la timp. Cantitățile rămân aceleași; se mută doar momentul începerii."},
{id:"q4",type:"mcq",q:"Lansarea pe bază de stoc este specifică:",opts:["producției de masă și produselor standardizate cu stocuri minime prestabilite","producției de prototipuri unicat","proiectelor de construcții","serviciilor de consultanță"],a:0,ex:"Pentru produse care se vând constant, ca șuruburile sau rulmenții, nu are sens să programezi manual fiecare lot. Fixezi un prag de stoc și lansezi automat când e atins, ca un frigider care te anunță că a rămas un singur ou."},
{id:"q5",type:"mcq",q:"Ce face regula NB (Next Best)?",opts:["Alege la fiecare pas produsul următor cu cel mai mic timp de reglare","Garantează soluția optimă globală","Ordonează produsele alfabetic","Se aplică doar pentru două utilaje"],a:0,ex:"Seamănă cu alegerea traseului mergând mereu spre cel mai apropiat oraș: rapid și adesea bun, dar fără garanția celui mai scurt drum total. La fiecare pas alegi reglajul cel mai scurt de la produsul curent."},
{id:"q6",type:"mcq",q:"În algoritmul Johnson, dacă valoarea minimă din tabel aparține utilajului U2, reperul:",opts:["se plasează cât mai la coada succesiunii","se plasează primul","se elimină din producție","se prelucrează doar pe U2"],a:0,ex:"U2 e ultima mașină. Un reper foarte rapid pe U2 se pune la final, ca linia să se închidă repede. Unul foarte rapid pe U1 se pune la început, ca U2 să poată porni cât mai devreme. Scopul e ca U2 să nu stea degeaba."},
{id:"q7",type:"mcq",q:"Ce minimizează algoritmul Johnson?",opts:["Durata totală de trecere a tuturor reperelor prin cele două utilaje","Numărul de muncitori","Costul materiilor prime","Numărul de repere"],a:0,ex:"Ordinea e aleasă astfel încât a doua mașină să aștepte cât mai puțin, deci ultimul reper iese cât mai devreme. Algoritmul nu are legătură cu numărul de oameni sau cu materialele."},
{id:"q8",type:"mcq",q:"Care este un dezavantaj al lansării centralizate?",opts:["Risc operațional mare: o singură fabrică poate bloca toată producția","Costuri de investiție foarte mari","Control slab al calității","Complexitate managerială ridicată"],a:0,ex:"Totul într-un singur loc aduce economii de scară, dar orice incident (incendiu, grevă, avarie) oprește toată producția. E dezavantajul lui „toate ouăle într-un singur coș”."},
{id:"k1",type:"classify",q:"Ce document de lansare descrie fiecare situație?",cats:["Bon de consum","Bon (dispoziție) de lucru","Notă de predare","Borderoul documentelor"],rows:[["„Operația 25, frezare, lot 100 buc, 0,8 min/buc, freza F2”",1],["Strunjirea predă 200 de bucăți rectificării, cu 3 rebuturi",2],["45 kg tablă OL37 eliberată din Magazia 1",0],["Lista cu toate documentele emise pentru lotul 47",3]],ex:"Urmărește drumul piesei: materialul iese din magazie (bon de consum), muncitorul primește sarcina (dispoziție de lucru), piesele trec la secția următoare (notă de predare). Borderoul ține evidența tuturor documentelor emise pentru lot."},
{id:"k2",type:"classify",q:"Ce metodă de lansare se potrivește?",cats:["Pe bază de grafice","Pe bază de devansări","Pe bază de stoc","Lansare grupată"],rows:[["Uscarea pieselor durează 48 de ore, deci se pornește mai devreme",1],["Stocul de rulmenți scade sub 5.000 buc și se lansează automat producția",2],["Comenzi mici de diferite culori se adună pentru a schimba matrița mai rar",3],["Fiecare lot intră în debitare la ora fixată în programul detaliat",0]],ex:"O uscare lungă cere pornire mai devreme (devansare). Stocul sub prag declanșează automat producția (stoc). Comenzile mici adunate ca să schimbi matrița mai rar înseamnă lansare grupată. Ora fixă din programul detaliat înseamnă lansare pe bază de grafic."},
{id:"k3",type:"classify",q:"Lansare centralizată sau descentralizată?",cats:["Centralizată","Descentralizată"],rows:[["Costuri de transport ridicate",0],["Adaptare rapidă la piața regională",1],["Economie de scară",0],["Risc distribuit între unități",1],["Tipică pentru FMCG și băuturi",1],["Complexitate managerială redusă",0]],ex:"Centralizarea înseamnă un singur loc mare: economie de scară, control simplu, transport scump. Descentralizarea înseamnă unități aproape de clienți: reacție rapidă la piața locală și risc împărțit, potrivită pentru produse ca băuturile, unde transportul pe distanțe mari nu merită."},
{id:"o1",type:"order",q:"Ordonați etapele lansării în fabricație.",steps:["Determinarea necesarului de articole","Bonul de materiale și borderoul de materiale","Dispoziția de lucru și borderoul de manoperă","Controlul, evidența, difuzarea și arhivarea documentelor"],ex:"Urmează logica fizică: afli de ce ai nevoie, scoți materialele, dai sarcinile de lucru, apoi verifici și arhivezi documentele. Nu poți da o sarcină de prelucrare înainte să existe materialul."},
{id:"g1",type:"calc",gen:"johnson",title:"Algoritmul Johnson"},
{id:"g2",type:"calc",gen:"nb",title:"Regula NB cu origine fixă"}
]},
/* ================= 8 ================= */
{id:"m8",nr:8,title:"Controlul",src:"Curs 10, Cap. 7",
key:["Etape: stabilirea standardelor, măsurarea performanței, compararea și determinarea abaterilor, măsurile de corecție.",
"Ciclul programare–control: fără abateri, programul se menține; cu abateri, sistemele informaționale de reacție declanșează corecții și reconsiderarea programelor.",
"Măsurarea trebuie să fie utilă, fiabilă, actuală și economică.",
"Controlul producției: cantitativ, calitativ, al costurilor.",
"Urmărire pe orizontală (fluxul produsului), pe verticală (locul de muncă) sau mixtă; metode pe bază de program-grafic, documente sau stocuri."],
items:[
{id:"q1",type:"mcq",q:"Ce se întâmplă în ciclul programare–control când nu există abateri?",opts:["Programul este menținut","Se elaborează imediat măsuri corective","Se reconsideră toate programele","Se oprește producția"],a:0,ex:"Dacă realitatea se potrivește cu planul, nu ai ce corecta. Intervenția are sens doar la o abatere; altfel consumi timp și creezi instabilitate fără motiv."},
{id:"q2",type:"mcq",q:"Un standard, în procesul de control, este:",opts:["o caracteristică a procesului sau produsului prescrisă înainte de desfășurare","rezultatul obținut la final","o sancțiune pentru abateri","un raport de audit"],a:0,ex:"Nu poți spune că ceva merge rău dacă n-ai stabilit dinainte ce înseamnă „bine”. Standardul e reperul fixat înainte („100 de piese pe tură, maximum 2% rebut”), cu care compari apoi rezultatul."},
{id:"q3",type:"mcq",q:"Ce caracteristică a măsurării lipsește dacă o firmă aeriană analizează punctualitatea pe datele din sezonul trecut?",opts:["Actualitatea","Fiabilitatea","Economicitatea","Utilitatea"],a:0,ex:"Datele din sezonul trecut pot fi corecte și utile, dar nu mai descriu situația de azi. Pe baza lor ai decide pentru o realitate care nu mai există."},
{id:"q4",type:"mcq",q:"Urmărirea pe orizontală înseamnă:",opts:["urmărirea unui produs sau lot pe măsură ce trece prin fazele procesului","urmărirea unui singur loc de muncă","verificarea doar a produsului final","compararea cu alte firme"],a:0,ex:"Pe orizontală urmărești piesa pe drumul ei prin fabrică, de la o operație la alta. Pe verticală stai la un loc de muncă și vezi tot ce trece pe acolo."},
{id:"q5",type:"mcq",q:"În diagrama controlului cantitativ, ce face dispecerul când o operație este întârziată?",opts:["Analizează întârzierea, urgentează și consemnează în caietul dispecer","Anulează comanda","Așteaptă finalul lunii","Mută operația la client"],a:0,ex:"Dispecerul nu poate anula comenzi și nici nu are sens să aștepte. Rolul lui e să afle cauza, să grăbească operația și să noteze problema, ca să poată fi analizată și prevenită pe viitor."},
{id:"q6",type:"mcq",q:"În sistemul PULL, fiecare produs este executat:",opts:["pentru a satisface o cerere venită de la locul de muncă următor","conform programului, indiferent de cerere","pentru a crește stocul","doar la sfârșitul lunii"],a:0,ex:"Ca la raftul unui supermarket: se aduce marfă când se golește, nu când a fost produsă. Fiecare operație produce doar ce i-a cerut operația următoare, așa că nu se adună stocuri."},
{id:"q7",type:"mcq",q:"Ordinea corectă în procesul calității este:",opts:["organismul tehnic fixează standardele, cel executiv fabrică, cel informativ inspectează","inspecția precede stabilirea standardelor","fabricația precede stabilirea standardelor","nu există o ordine"],a:0,ex:"Nu poți verifica fără să știi cu ce compari, iar inspecția are sens doar după ce produsul există. Ordinea e fixă: standard, fabricație, verificare."},
{id:"c1",type:"mcq",case:true,ctx:"Într-o fabrică de confecții, stocul de piese croite dintre secția de croit și cea de cusut crește de la o zi la alta.",q:"Ce metodă de control a semnalat problema și unde este, probabil, blocajul?",opts:["Control pe bază de stocuri; blocajul este la cusut","Control pe bază de documente; blocajul este la croit","Control strategic; blocajul este la vânzări","Control „totul sau nimic”; blocajul este la ambalare"],a:0,ex:"Dacă piesele croite se adună, croitul lucrează mai repede decât poate prelua cusutul. Stocul crește mereu în fața operației celei mai lente, ca o coadă în fața unei case de marcat."},
{id:"k1",type:"classify",q:"Ce formă de control descrie fiecare situație?",cats:["Anticipat","„Totul sau nimic”","A posteriori"],rows:[["Calibrarea aparatelor înainte de pornirea producției",0],["Un lot farmaceutic e respins integral pentru un parametru depășit",1],["Analiza lunară a respectării termenului de 48 h la reclamații",2],["Instruirea personalului înainte de lansarea unui produs nou",0]],ex:"Contează momentul: înainte de producție, pentru prevenire (anticipat); pe loc, cu decizie de tip trece sau nu trece (totul sau nimic); după încheiere, pentru concluzii (a posteriori)."},
{id:"k2",type:"classify",q:"Clasificați după nivel și tehnologie.",cats:["Control operațional","Control strategic","Unitate „cibernetică”"],rows:[["Monitorizarea zilnică a timpului de livrare",0],["Analiza trimestrială pentru intrarea pe o piață nouă",1],["Un CNC se oprește singur când piesa iese din toleranță",2],["Verificarea cantităților realizate în fiecare tură",0]],ex:"Ce se verifică zilnic e operațional. Ce privește direcția firmei pe termen lung e strategic. Când mașina se oprește singură, fără om, controlul e încorporat în tehnologie (cibernetic)."},
{id:"o1",type:"order",q:"Ordonați etapele procesului de control.",steps:["Stabilirea standardelor","Măsurarea performanței","Compararea și determinarea abaterilor","Introducerea măsurilor de corecție"],ex:"E logica oricărei verificări: stabilești ce vrei, vezi ce ai obținut, compari și abia la final corectezi. Nu poți corecta o abatere pe care încă n-ai măsurat-o."},
{id:"g1",type:"calc",gen:"gantt",title:"Grafic Gantt cumulativ"}
]},
/* ================= 9 ================= */
{id:"m9",nr:9,title:"Metode ale managementului operațional",src:"Cap. 8.1",
key:["JIT: nivel scăzut de muncă în procesare și inventar, calitate ridicată, sistem PULL.",
"Kanban este metoda de „autorizare” a producției și a mișcării materialelor în JIT.",
"MRP: planificare-programare și control, informații detaliate, informatizare; JIT: îmbunătățire continuă, eliminarea pierderilor, control vizual.",
"JOBSCOP se conduce după comenzi, verifică capacitatea înainte de acceptare și reprogramează o singură comandă.",
"Metoda priorităților se bazează pe calculul ciclurilor de fabricație și al devansărilor."],
items:[
{id:"q1",type:"mcq",q:"Ce rol are sistemul Kanban în JIT?",opts:["Metodă de autorizare a producției și a mișcării materialelor","Program de contabilitate","Metodă de recrutare","Algoritm de calcul al lotului optim"],a:0,ex:"Kanban e un bilet de voie: fără cartonaș nu produci și nu muți materiale. Producția pornește doar când operația următoare cere, deci e o metodă de autorizare, nu un program informatic sau o formulă."},
{id:"q2",type:"mcq",q:"Ce presupune JIT, dincolo de stocurile reduse?",opts:["Niveluri ridicate de calitate","Loturi cât mai mari","Stocuri mari de siguranță","Renunțarea la programul master"],a:0,ex:"Cu stocuri mici nu ai rezervă pentru piese defecte: un singur lot prost oprește tot fluxul. Stocul mic funcționează doar dacă te poți baza pe faptul că fiecare piesă e bună."},
{id:"q3",type:"mcq",q:"Ce face JOBSCOP înainte de acceptarea unei comenzi?",opts:["Verifică disponibilitatea capacităților la locurile de muncă implicate","Calculează necesarul pentru toate elementele sistemului","Stabilește un timp de devansare fix","Cere modificarea definitivă a produsului"],a:0,ex:"Înainte să spui „da” clientului, verifici dacă oamenii și mașinile au timp. Altfel promiți termene pe care nu le poți respecta."},
{id:"q4",type:"mcq",q:"Ce înseamnă că în MRP locurile de muncă sunt „încărcate infinit”?",opts:["Sistemul nu ține cont de restricțiile de capacitate","Locurile de muncă lucrează non-stop","Nu există stocuri","Capacitatea crește automat"],a:0,ex:"Sistemul calculează ce trebuie făcut ca și cum fiecare loc de muncă ar putea absorbi orice volum. Nu vede că strungul are deja săptămâna plină, iar acest conflict trebuie rezolvat separat."},
{id:"c1",type:"mcq",case:true,ctx:"O firmă de utilaje la comandă primește des cereri cu materiale speciale și modificări de design pentru un singur client. Planificatorii se plâng că sistemul rigid îi obligă să recalculeze tot programul la fiecare modificare.",q:"Ce metodă se potrivește mai bine?",opts:["JOBSCOP, pentru că permite reprogramarea unei comenzi și modificarea normelor pentru o singură comandă","MRP clasic, pentru că are timpi de devansare fixi","JIT pur, cu Kanban pentru fiecare piesă unicat","Planificarea agregat pe 18 luni"],a:0,ex:"Când fiecare comandă e unică, un sistem care recalculează tot programul la orice schimbare devine o povară. JOBSCOP lucrează pe comenzi și permite ajustarea uneia singure fără a le atinge pe celelalte."},
{id:"k1",type:"classify",q:"MRP sau JIT?",cats:["MRP","JIT"],rows:[["Liste de materiale (BOM)",0],["Kanban",1],["Eliminarea pierderilor",1],["Informații detaliate, de mare acuratețe",0],["Operaționalizare prin informatizare",0],["Implicare activă, inventar redus",1]],ex:"MRP înseamnă calcul și informație: liste de materiale, date exacte, totul în calculator. JIT înseamnă disciplină în hală: cartonașe Kanban, eliminarea risipei, oameni implicați, stocuri mici."},
{id:"k2",type:"classify",q:"JOBSCOP sau MRP?",cats:["JOBSCOP","MRP"],rows:[["Sistemul se conduce după comenzi",0],["Fiecare element are un timp de devansare predeterminat",1],["Recalculează devansările după încărcarea locurilor de muncă",0],["Modificările de norme cer schimbarea definitivă a produsului de către Proiectare",1],["Actualizare permanentă, în timp real",0],["Toate elementele trebuie definite ca elemente de inventar",1]],ex:"JOBSCOP gândește în comenzi și se adaptează din mers: recalculează devansările după încărcarea reală și se actualizează continuu. MRP gândește în articole de inventar cu parametri fixi, deci orice schimbare cere o modificare formală."},
{id:"g1",type:"calc",gen:"prioritati",title:"Calculul priorităților"}
]},
/* ================= 10 ================= */
{id:"m10",nr:10,title:"Eficiența managementului operațional",src:"Cap. 9",
key:["Eficiența MO are și o formă necuantificabilă, cu efect propagat și de perspectivă.",
"Abordarea eficienței se nuanțează după sistemul, metodele și tehnicile de conducere folosite.",
"Metode neparametrice (anchete, chestionare, interviuri) și parametrice (teoria informației, metode matematice).",
"Sistemul coeficienților organizatorici exprimă variabilele organizaționale ca mărimi relative.",
"Indicatori sintetici: îndeplinirea programului, ritmicitatea, folosirea capacității și a fondului de timp, viteza de rotație a mijloacelor circulante, ponderea cheltuielilor neeconomicoase, costul MO."],
items:[
{id:"q1",type:"mcq",q:"Ce particularitate are eficiența managementului operațional?",opts:["Are și o formă necuantificabilă, cu caracter propagat și de perspectivă","Se poate măsura exclusiv prin profit","Este identică cu eficiența managementului general","Nu poate fi analizată"],a:0,ex:"Un sistem bun de programare nu are efect doar în luna curentă: oamenii lucrează mai liniștit, clienții revin, problemele sunt prevenite. Multe efecte apar în timp și se răspândesc în firmă, deci nu se pot pune ușor într-o cifră."},
{id:"q2",type:"mcq",q:"Care dintre metode este neparametrică?",opts:["Chestionarul","Metoda entropiei","Metoda „Management Games”","Indicele funcțional de progres"],a:0,ex:"Metodele neparametrice întreabă oamenii (chestionare, interviuri, anchete) și obțin percepții. Cele parametrice calculează indicatori din date; entropia, jocurile de management și indicele de progres sunt calcule."},
{id:"q3",type:"mcq",q:"Metoda entropiei face parte din:",opts:["metodele parametrice bazate pe teoria informației","metodele neparametrice","metodele de recrutare","metodele de lansare în fabricație"],a:0,ex:"Entropia măsoară gradul de dezordine sau incertitudine dintr-un sistem. Cu cât informația din MO e mai bine organizată, cu atât incertitudinea scade. E o metodă cantitativă, din teoria informației."},
{id:"q4",type:"mcq",q:"Ce caracterizează sistemul coeficienților organizatorici?",opts:["Estimarea cantitativă a variabilelor organizaționale, ca mărimi relative","Evaluarea calitativă prin interviuri","Calculul salariilor","Stabilirea prețurilor"],a:0,ex:"Lucrurile greu de măsurat direct, cum ar fi cât de bine e organizată producția, se transformă în rapoarte: realizat față de planificat, folosit față de disponibil. Rapoartele permit comparații între secții de mărimi diferite."},
{id:"q6",type:"mcq",q:"De ce apare „costul acțiunilor de implementare a metodologiei de MO” printre indicatori?",opts:["Pentru că metodele riguroase pot fi costisitoare și trebuie comparate cu beneficiul lor","Pentru că MO nu are costuri","Pentru că e cerut de legislația fiscală","Pentru că înlocuiește costul de producție"],a:0,ex:"Un sistem de MO foarte sofisticat poate costa mai mult decât economisește. Ca la orice investiție, întrebarea e dacă beneficiul depășește costul, deci și costul trebuie măsurat."},
{id:"c1",type:"mcq",case:true,ctx:"O secție a realizat 102% din programul lunar, dar aproape toată producția s-a făcut în ultima decadă, cu ore suplimentare.",q:"Ce arată situația?",opts:["Programul e îndeplinit, dar ritmicitatea este slabă","Secția este perfect eficientă","Capacitatea este subdimensionată","Nu există nicio problemă de management operațional"],a:0,ex:"102% arată că s-a produs suficient pe lună, nu și cum. Dacă aproape totul s-a făcut în ultima decadă, primele două au avut capacitate nefolosită, iar ultima ore suplimentare plătite în plus."},
{id:"k1",type:"classify",q:"Clasificați metodele de măsurare a eficienței.",cats:["Neparametrice","Parametrice: teoria informației","Parametrice: metode matematice"],rows:[["Interviuri",0],["Cantitatea de informații",1],["Simulation Games",2],["Anchete",0],["Energia informațională",1],["Indicele funcțional de progres",2]],ex:"Dacă metoda întreabă oameni, e neparametrică. Dacă măsoară informația (cantitate, energie), ține de teoria informației. Dacă folosește modele și simulări, ține de metodele matematice."},
{id:"g1",type:"calc",gen:"indicatori",title:"Indicatori de eficiență"},
{id:"g2",type:"calc",gen:"ritm",title:"Coeficientul de ritmicitate"}
]}
];

/* Hala: stare 0 = neîncepută, 1 = în lucru, 2 = finalizată */
function hall(nr,state,stars){
  const c=HUE[nr-1],lit=state===2,win=lit?"#FFE27A":state===1?"#CFE8FF":"#DCE3EA";
  const wall=state===0?"#C9D3DD":"#FFFFFF";

function parseNum(s){
  if(s===undefined||s===null)return NaN;s=String(s).trim().replace(/\s|\u00a0/g,"").replace("−","-").replace("%","");
  if(s==="")return NaN;
  if(s.includes(".")&&s.includes(","))s=s.replace(/\./g,"").replace(",",".");
  else if(s.includes(","))s=s.replace(",",".");
  else if(/^-?\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,"");
  return Number(s);
}
function numOk(v,f){const x=parseNum(v);if(Number.isNaN(x))return false;
  let tol=f.tolAbs!==undefined?f.tolAbs:f.tolRel!==undefined?Math.abs(f.ans)*f.tolRel:(f.dec?0.5*Math.pow(10,-f.dec)+1e-9:0.5);
  if(f.tolAbs===undefined&&f.tolRel===undefined&&Math.abs(f.ans)>=1000)tol=Math.max(tol,Math.abs(f.ans)*0.001);
  return Math.abs(x-f.ans)<=tol;}
function shuffledIdx(n,seed){return mkR(seed).shuffle([...Array(n).keys()]);}

function itemDef(mid,iid){if(mid==="final"){const [m,i]=iid.split(".");return modById(m).items.find(x=>x.id===i);}return modById(mid).items.find(x=>x.id===iid);}
function itemsOf(mid){
  if(mid==="final"){const st=ms("final");const pool=[];MODULES.forEach(m=>m.items.forEach(i=>{if(i.type==="mcq")pool.push(m.id+"."+i.id);}));return mkR(st.seed).shuffle(pool).slice(0,FINAL_N);}
  return modById(mid).items.map(i=>i.id);
}
const genOf=(def,st)=>GEN[def.gen](st.seed);
function fieldOk(f,v){if(f.type==="select")return v!==undefined&&v!==""&&Number(v)===f.ans;return numOk(v,f);}
function grade(def,st,g){
  if(def.type==="mcq")return st.vals.c==def.a?1:0;
  if(def.type==="classify")return def.rows.filter((r,k)=>Number(st.vals["r"+k])===r[1]).length/def.rows.length;
  if(def.type==="order")return def.steps.filter((s,k)=>Number(st.vals["p"+k])===k).length/def.steps.length;
  if(def.type==="calc")return g.fields.filter((f,k)=>fieldOk(f,st.vals["f"+k])).length/g.fields.length;
}
function complete(def,st,g){
  const has=k=>st.vals[k]!==undefined&&String(st.vals[k]).trim()!=="";
  if(def.type==="mcq")return has("c");
  if(def.type==="classify")return def.rows.every((r,k)=>has("r"+k));
  if(def.type==="order")return def.steps.every((s,k)=>has("p"+k));
  if(def.type==="calc")return g.fields.every((f,k)=>has("f"+k));
}
function nfx(f){return f.dec?Number(f.ans).toLocaleString("ro-RO",{minimumFractionDigits:f.dec,maximumFractionDigits:f.dec}):Math.abs(f.ans)>=1000?Number(f.ans).toLocaleString("ro-RO",{maximumFractionDigits:0}):String(Math.round(f.ans*100)/100).replace(".",",");}
function modStats(mid){const ids=itemsOf(mid);let checked=0,sum=0;ids.forEach(i=>{const st=S.mods[mid]&&S.mods[mid].items[i];if(st&&st.checked){checked++;sum+=st.score;}});return{total:ids.length,checked,sum,score:ids.length?sum/ids.length:0};}
const starsFor=p=>p>=90?3:p>=75?2:p>=50?1:0;
function gradeOf(xp){let g=GRADES[0],i=0;GRADES.forEach((x,k)=>{if(xp>=x.xp){g=x;i=k;}});const nx=GRADES[i+1];return{g,i,nx,frac:nx?(xp-g.xp)/(nx.xp-g.xp):1};}
function modState(id){const st=S.mods[id];if(st&&st.done)return 2;if(st&&Object.values(st.items).some(x=>x.checked))return 1;return 0;}

function itemBody(mid,iid){
  const def=itemDef(mid,iid),st=is(mid,iid),dis=st.checked?"disabled":"";let g=null,h="";
  if(def.type==="mcq"){
    const perm=shuffledIdx(def.opts.length,st.seed),L="ABCD";

      perm.map((o,pi)=>{const sel=String(st.vals.c)===String(o);let m="";if(st.checked){if(o===def.a)m="right";else if(sel)m="wrong";}
      return`<label class="opt ${sel?"sel":""} ${m}"><input type="radio" name="r-${iid}" value="${o}" ${sel?"checked":""} ${dis} data-k="c"><span class="ol">${L[pi]}</span><span class="ot">${def.opts[o]}</span></label>`;}).join("")+`</div>`;
  }
  if(def.type==="classify"){
    h=`<h2 class="q">${def.q}</h2><div class="rows">`+def.rows.map((r,k)=>{const v=st.vals["r"+k];const m=st.checked?(Number(v)===r[1]?"right":"wrong"):"";
      return`<div class="row ${m}"><span class="rt">${r[0]}</span><div class="chips" role="radiogroup" aria-label="${esc(r[0])}">${def.cats.map((c,ci)=>`<button type="button" class="chip ${String(v)===String(ci)?"on":""} ${st.checked&&ci===r[1]?"ans":""}" data-k="r${k}" data-v="${ci}" ${dis} aria-pressed="${String(v)===String(ci)}">${c}</button>`).join("")}</div></div>`;}).join("")+`</div>`;
  }
  if(def.type==="order"){
    const perm=shuffledIdx(def.steps.length,st.seed);const placed=def.steps.map((s,k)=>st.vals["p"+k]).filter(x=>x!==undefined&&x!=="").map(Number);
    h=`<h2 class="q">${def.q}</h2><p class="sub">Atinge pașii în ordinea corectă.</p><ol class="slots">`+def.steps.map((s,k)=>{const v=st.vals["p"+k];const has=v!==undefined&&v!=="";const m=st.checked?(Number(v)===k?"right":"wrong"):"";
      return`<li class="slot ${has?"full":""} ${m}"><span class="sn">${k+1}</span><span>${has?def.steps[Number(v)]:"…"}</span>${st.checked&&Number(v)!==k?`<span class="fix">Corect: ${def.steps[k]}</span>`:""}</li>`;}).join("")+`</ol>`+
      (st.checked?"":`<div class="pool">${perm.filter(o=>!placed.includes(o)).map(o=>`<button type="button" class="chip big" data-place="${o}">${def.steps[o]}</button>`).join("")}</div>${placed.length?`<button type="button" class="link" data-act="undo">Anulează ultimul pas</button>`:""}`);
  }
  if(def.type==="calc"){

    const fld=(f,k)=>{const v=st.vals["f"+k];const m=st.checked?(fieldOk(f,v)?"right":"wrong"):"";
      const fix=st.checked&&!fieldOk(f,v)?`<span class="fix">Corect: ${f.type==="select"?f.options[f.ans]:nfx(f)}</span>`:"";
      if(f.type==="select")return`<label class="fld ${m}"><span>${f.label}</span><select data-k="f${k}" ${dis}><option value="">Alege…</option>${f.options.map((o,oi)=>`<option value="${oi}" ${String(v)===String(oi)?"selected":""}>${o}</option>`).join("")}</select>${fix}</label>`;
      return`<label class="fld ${m}"><span>${f.label}</span><input inputmode="decimal" autocomplete="off" data-k="f${k}" value="${esc(v??"")}" ${dis}>${fix}</label>`;};
    let fields;
    if(g.table){fields=`<div class="tw"><table class="grid"><thead><tr><th></th>${g.table.cols.map(c=>`<th>${c}</th>`).join("")}</tr></thead><tbody>`+

    else fields=`<div class="flds">${g.fields.map(fld).join("")}</div>`;
    h=`<h2 class="q">${def.title}</h2><div class="stmt">${g.text}</div>${fields}<p class="sub">Zecimalele se scriu cu virgulă. Separatorul de mii e opțional.</p>`;
  }

}
