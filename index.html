  if(!ist.checked)foot=`<div class="cta"><button class="btn big full" data-act="check" ${can?"":"disabled"}>Verifică</button></div>`;
  else{const ok=ist.score>=0.999,pt=ist.score>0&&!ok;const corr=ok?"":def.type==="mcq"?`<p class="corr">Răspunsul corect: <b>${def.opts[def.a]}</b></p>`:def.type==="calc"?"":`<p class="corr">Răspunsurile corecte sunt marcate cu verde mai sus.</p>`;
    const sol=def.type==="calc"?`<details class="sol" ${ok?"":"open"}><summary>Vezi rezolvarea pas cu pas</summary>${g.sol}</details>`:`${corr}<p>${def.ex}</p>`;
    const lost=st.lastLost===iid?`<p class="lifel">Ai pierdut o viață. ${st.over?"Hala s-a oprit.":`Mai ai ${3-st.mistakes}.`}</p>`:"";
    const all=modStats(mid).checked===ids.length;const last=all&&(!st.reviewing||pos===ids.length-1);
    foot=`<div class="sheet ${ok?"ok":pt?"pt":"no"}" role="status"><div class="sh"><span class="si">${ok?"✓":pt?"◐":"✕"}</span><b>${ok?pick(["Corect!","Excelent!","Exact așa!","Perfect!"],iid):pt?`Parțial corect: ${pct(ist.score)}%`:"Nu de data asta"}</b></div><div class="sb">${lost}${sol}</div>
    <div class="sa">${st.over?`<button class="btn big" data-act="gameover">Vezi ce trebuie recapitulat</button>`:`${def.type==="calc"&&mid!=="final"?`<button class="btn ghost" data-act="regen">Alte cifre</button>`:""}<button class="btn big" data-act="${last?"finish":"next"}">${last?"Vezi rezultatul":"Continuă"}</button>`}</div></div>`;}
  return`<div class="lt"><a href="#/${mid}" class="x" aria-label="Închide lecția">✕</a><div class="segs">${segs}</div>${mid!=="final"?`<span class="lives" aria-label="${3-(st.mistakes||0)} vieți rămase">${[0,1,2].map(i=>`<span class="hrt ${i<3-(st.mistakes||0)?"on":"off"} ${i===3-(st.mistakes||0)&&st.lastLost===iid?"lost":""}">♥</span>`).join("")}</span>`:""}<span class="streak ${S.streak>=3?"hot":""}" title="Serie de răspunsuri corecte">🔥 ${S.streak}</span></div>
  <article class="card ${ist.checked?(ist.score>=0.999?"ok":ist.score>0?"pt":"no"):""}" data-iid="${iid}"><div class="ck"><span class="tag t-${kind}">${def.type==="calc"?"Calcul":typeLabel[kind]}</span><span class="cn">${pos+1} / ${ids.length}</span></div>${h}</article>${foot}`;
}
const pick=(a,s)=>a[[...s].reduce((x,c)=>x+c.charCodeAt(0),0)%a.length];

/* ===== VIEW: REZULTAT ===== */
function result(mid){
  const m=modMeta(mid),st=ms(mid),s=modStats(mid),p=pct(s.score),n=starsFor(p);
  const nb=(st.newBadges||[]).map(id=>BADGES.find(b=>b.id===id)).filter(Boolean);
  const msg=p>=90?"Hala funcționează impecabil.":p>=75?"Producție bună. Mai e loc de reglaje fine.":p>=50?"Hala merge, dar cu opriri. Revezi ideile-cheie.":"Hala are nevoie de revizie. Recitește capitolul și reia lecția.";
  const nextM=mid!=="final"&&m.nr<10?`<a class="btn big" href="#/m${m.nr+1}">Hala ${m.nr+1}</a>`:mid!=="final"?`<a class="btn big" href="#/final">Testul final</a>`:"";
  return`<section class="res"><div class="rstars">${[0,1,2].map(i=>`<span class="rs ${i<n?"on":""}" style="--d:${i*0.18+0.2}s">★</span>`).join("")}</div>
  <p class="kick">${m.title}</p><p class="rp">${p}%</p><p class="rm">${msg}</p>
  <div class="rgrid"><div><b>+${st.xpRun||0}</b><span>XP câștigat</span></div><div><b>${s.total}</b><span>itemi rezolvați</span></div><div><b>${st.best}%</b><span>cel mai bun</span></div></div>
  ${nb.length?`<div class="rnb"><h2>Insigne noi</h2>${nb.map(b=>`<div class="bdg has pop"><span class="be">${b.e}</span><span class="bn">${b.n}</span><span class="bd">${b.d}</span></div>`).join("")}</div>`:""}
  <div class="mact">${nextM}<a class="btn ghost" href="#/">Harta fabricii</a><button class="btn ghost" data-act="review">Revezi răspunsurile</button><button class="btn ghost" data-act="reset">Reia lecția</button></div></section>`;
}

/* ===== VIEW: HALA OPRITĂ ===== */
function over(mid){
  const m=modMeta(mid),st=ms(mid);
  const list=(st.mistakeIds||[]).map(iid=>{const def=itemDef(mid,iid),ist=is(mid,iid);let yours="",right="",extra="";
    if(def.type==="mcq"){yours=def.opts[Number(ist.vals.c)];right=def.opts[def.a];extra=`<p>${def.ex}</p>`;}
    if(def.type==="classify"){extra=`<ul class="fixl">${def.rows.map((r,k)=>Number(ist.vals["r"+k])===r[1]?"":`<li>${r[0]}: <s>${def.cats[Number(ist.vals["r"+k])]}</s> <b>${def.cats[r[1]]}</b></li>`).join("")}</ul><p>${def.ex}</p>`;}
    if(def.type==="order"){yours=def.steps.map((s,k)=>def.steps[Number(ist.vals["p"+k])]).join(" → ");right=def.steps.join(" → ");extra=`<p>${def.ex}</p>`;}
    if(def.type==="calc"){const g=genOf(def,ist);extra=`<ul class="fixl">${g.fields.map((f,k)=>fieldOk(f,ist.vals["f"+k])?"":`<li>${f.label}: <s>${f.type==="select"?(f.options[Number(ist.vals["f"+k])]??"–"):esc(ist.vals["f"+k]??"–")}</s> <b>${f.type==="select"?f.options[f.ans]:nfx(f)}</b></li>`).join("")}</ul><details class="sol"><summary>Rezolvarea pas cu pas</summary>${g.sol}</details>`;}
    return`<li class="mis"><span class="tag t-${def.type==="mcq"&&def.case?"case":def.type}">${def.type==="calc"?"Calcul":typeLabel[def.type==="mcq"&&def.case?"case":def.type]}</span><h3>${def.type==="calc"?def.title:def.q}</h3>${yours?`<p class="yr">Ai răspuns: <s>${yours}</s></p>`:""}${right?`<p class="rr">Corect: <b>${right}</b></p>`:""}${extra}</li>`;}).join("");
  return`<div class="lt"><a href="#/" class="x" aria-label="Înapoi la hartă">✕</a></div>
  <section class="ovr"><div class="ovi">${hall(m.nr,0,0)}<span class="warn">!</span></div><h1>Hala s-a oprit</h1><p>Ai greșit de 3 ori în această lecție. Citește răspunsurile corecte, apoi pornește din nou hala. Vei primi alte cifre la calcule și altă ordine a variantelor.</p>
  <ol class="misl">${list}</ol><div class="mact"><button class="btn big" data-act="restart">Repornește hala</button><a class="btn ghost" href="#/">Harta fabricii</a></div></section>`;
}

/* ===== XP, INSIGNE ===== */
function award(id){if(S.badges[id])return;S.badges[id]=Date.now();toast(`${BADGES.find(b=>b.id===id).e} Insignă nouă: ${BADGES.find(b=>b.id===id).n}`);if(cur.mid&&S.mods[cur.mid])(S.mods[cur.mid].newBadges=S.mods[cur.mid].newBadges||[]).push(id);}
function onChecked(mid,def,ist){
  const ok=ist.score>=0.999;const before=gradeOf(S.xp).i;
  let gain=Math.round((def.type==="calc"?20:10)*ist.score);
  if(ok){S.streak++;if(S.streak>=3)gain+=5;}else S.streak=0;
  S.bestStreak=Math.max(S.bestStreak||0,S.streak);S.xp+=gain;ms(mid).xpRun=(ms(mid).xpRun||0)+gain;
  if(S.streak>=5)award("streak5");if(S.streak>=10)award("streak10");
  if(ok&&def.gen&&["agregat","mrp","johnson","eoq"].includes(def.gen))award(def.gen);
  const after=gradeOf(S.xp).i;if(after>before)toast(`${GRADES[after].e} Ai avansat: ${GRADES[after].n}!`,true);
  buzz(ok?18:[35,40,35]);
  return gain;
}
function resetLesson(st){st.items={};st._final=false;st.seed=newSeed();st.pos=0;st.xpRun=0;st.newBadges=[];st.mistakes=0;st.mistakeIds=[];st.over=false;st.lastLost=null;st.reviewing=false;st.sentFinish=false;}
function finalize(mid){
  const st=ms(mid),s=modStats(mid);if(st._final)return;
  st._final=true;st.attempts=(st.attempts||0)+1;st.last=pct(s.score);st.best=Math.max(st.best??0,st.last);st.done=true;if(!st.sentFinish){st.sentFinish=true;track("finish",mid,{score:st.last,attempt:st.attempts});}
  if(mid!=="final"){award("first");if(st.last===100)award("perfect");const d=MODULES.filter(m=>modState(m.id)===2).length;if(d>=5)award("half");if(d>=10)award("all");}
  else if(st.last>=80)award("final");
  save(true);
}

/* ===== TOAST, CONFETTI, XP FLOAT ===== */
function toast(t,big){const n=document.querySelectorAll(".toast:not(.out)").length;const el=document.createElement("div");el.style.top=(14+n*62)+"px";el.className="toast"+(big?" big":"");el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.classList.add("out"),2600);setTimeout(()=>el.remove(),3200);}
function floatXP(n,el){if(!n||!el)return;const f=document.createElement("span");f.className="xpf";f.textContent=`+${n} XP`;const r=el.getBoundingClientRect();f.style.left=(r.left+r.width/2)+"px";f.style.top=(r.top+window.scrollY-28)+"px";f.style.left=(r.right-50)+"px";document.body.appendChild(f);setTimeout(()=>f.remove(),1300);}
function confetti(){if(RM())return;const c=document.createElement("canvas");c.className="conf";document.body.appendChild(c);const x=c.getContext("2d");const W=c.width=innerWidth,H=c.height=innerHeight;
  const P=Array.from({length:140},()=>({x:W/2+(Math.random()-.5)*80,y:H*0.35,vx:(Math.random()-.5)*11,vy:-Math.random()*12-4,r:Math.random()*6+4,c:HUE[Math.floor(Math.random()*11)],a:Math.random()*6,s:(Math.random()-.5)*.3}));
  let t=0;(function fr(){t++;x.clearRect(0,0,W,H);P.forEach(p=>{p.vy+=.32;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.a+=p.s;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/3,p.r,p.r*.66);x.restore();});if(t<170)requestAnimationFrame(fr);else c.remove();})();}

/* ===== ROUTER ===== */
let cur={mid:null,view:"home"};
function render(anim){
  const app=$("#app");let html;
  if(cur.view==="home")html=home();else if(cur.view==="intro")html=intro(cur.mid);else if(cur.view==="card")html=card(cur.mid,ms(cur.mid).pos);else if(cur.view==="over")html=over(cur.mid);else html=result(cur.mid);
  app.className="v-"+cur.view;app.innerHTML=html;
  if(anim&&!RM()){const c=$(".card")||$(".mi")||$(".res");if(c){c.classList.add("in-"+anim);}}
  if(cur.view==="home"){requestAnimationFrame(drawPath);}
  if(cur.view==="result"){const p=pct(modStats(cur.mid).score);if(p>=75)setTimeout(confetti,250);}
}
function route(){document.querySelectorAll('.conf,.toast').forEach(c=>c.remove());
  const h=location.hash.replace(/^#\/?/,"");const mid=h&&(h==="final"||modById(h))?h:null;
  cur=mid?{mid,view:"intro"}:{mid:null,view:"home"};
  document.title=mid?modMeta(mid).title+" | Management operațional":"Management operațional | Construiește-ți fabrica";
  render("up");window.scrollTo(0,0);
}
function goCard(pos,dir){ms(cur.mid).pos=pos;cur.view="card";render(dir||"right");window.scrollTo(0,0);}
window.addEventListener("resize",()=>{if(cur.view==="home")drawPath();});

/* ===== EVENIMENTE ===== */
function setVal(k,v){const ids=itemsOf(cur.mid);const iid=ids[ms(cur.mid).pos];const ist=is(cur.mid,iid);ist.vals[k]=v;save();return{iid,ist,def:itemDef(cur.mid,iid)};}
function refreshCTA(){const ids=itemsOf(cur.mid);const iid=ids[ms(cur.mid).pos];const ist=is(cur.mid,iid),def=itemDef(cur.mid,iid);const g=def.type==="calc"?genOf(def,ist):null;const b=$('[data-act="check"]');if(b)b.disabled=!complete(def,ist,g);}
document.addEventListener("input",e=>{
  if(cur.view!=="card")return;const el=e.target;if(!el.dataset.k)return;setVal(el.dataset.k,el.value);
  if(el.type==="radio"){document.querySelectorAll(".opt").forEach(o=>o.classList.toggle("sel",o.querySelector("input").checked));buzz(8);}
  refreshCTA();
});
document.addEventListener("click",e=>{
  const chip=e.target.closest(".chip[data-k]");
  if(chip&&cur.view==="card"&&!chip.disabled){setVal(chip.dataset.k,chip.dataset.v);chip.parentElement.querySelectorAll(".chip").forEach(c=>{c.classList.toggle("on",c===chip);c.setAttribute("aria-pressed",c===chip);});buzz(8);refreshCTA();return;}
  const pl=e.target.closest("[data-place]");
  if(pl&&cur.view==="card"){const ids=itemsOf(cur.mid);const ist=is(cur.mid,ids[ms(cur.mid).pos]);const def=itemDef(cur.mid,ids[ms(cur.mid).pos]);const k=def.steps.findIndex((s,i)=>ist.vals["p"+i]===undefined||ist.vals["p"+i]==="");if(k>=0){ist.vals["p"+k]=pl.dataset.place;save();buzz(8);render();}return;}
  const go=e.target.closest("[data-go]");if(go){const k=Number(go.dataset.go),p=ms(cur.mid).pos;if(k!==p)goCard(k,k>p?"right":"left");return;}
  const b=e.target.closest("[data-act]");if(!b)return;const act=b.dataset.act;
  if(act==="start"){const st=ms(cur.mid);st.reviewing=false;st.xpRun=0;st.newBadges=[];track("start",cur.mid);goCard(0);}
  if(act==="resume"){const st=ms(cur.mid);st.reviewing=false;const ids=itemsOf(cur.mid);let p=ids.findIndex(i=>!(st.items[i]&&st.items[i].checked));goCard(p<0?0:p);}
  if(act==="review"){ms(cur.mid).reviewing=true;goCard(0);}
  if(act==="undo"){const ids=itemsOf(cur.mid);const ist=is(cur.mid,ids[ms(cur.mid).pos]);const def=itemDef(cur.mid,ids[ms(cur.mid).pos]);for(let k=def.steps.length-1;k>=0;k--){if(ist.vals["p"+k]!==undefined&&ist.vals["p"+k]!==""){delete ist.vals["p"+k];break;}}save();render();}
  if(act==="check"){const ids=itemsOf(cur.mid);const iid=ids[ms(cur.mid).pos];const ist=is(cur.mid,iid),def=itemDef(cur.mid,iid);const g=def.type==="calc"?genOf(def,ist):null;
    ist.score=grade(def,ist,g);ist.checked=true;const gain=onChecked(cur.mid,def,ist);const mst=ms(cur.mid);mst.lastLost=null;
    if(cur.mid!=="final"&&isMistake(def,ist.score)){mst.mistakes=(mst.mistakes||0)+1;(mst.mistakeIds=mst.mistakeIds||[]).push(iid);mst.lastLost=iid;if(mst.mistakes>=3){mst.over=true;buzz([80,60,80,60,160]);}}
    save(true);
    if(!mst.over&&modStats(cur.mid).checked===ids.length)finalize(cur.mid);
    render();const c=$(".card");if(c&&!RM())c.classList.add(ist.score>=0.999?"pulse":"shake");floatXP(gain,$(".sheet .sh"));
    const sh=$(".sheet");if(sh){sh.setAttribute("tabindex","-1");sh.focus({preventScroll:true});}}
  if(act==="next"){const ids=itemsOf(cur.mid);const st=ms(cur.mid);const all=modStats(cur.mid).checked===ids.length;
    if(all){if(st.pos<ids.length-1)goCard(st.pos+1);else{st.reviewing=false;cur.view="result";render("up");window.scrollTo(0,0);}}
    else{let p=ids.findIndex((i,k)=>k>st.pos&&!(st.items[i]&&st.items[i].checked));if(p<0)p=ids.findIndex(i=>!(st.items[i]&&st.items[i].checked));goCard(p);}}
  if(act==="finish"){ms(cur.mid).reviewing=false;cur.view="result";render("up");window.scrollTo(0,0);}
  if(act==="regen"){const ids=itemsOf(cur.mid);const ist=is(cur.mid,ids[ms(cur.mid).pos]);ist.seed=newSeed();ist.vals={};ist.checked=false;ist.score=0;ms(cur.mid)._final=false;save(true);render("right");window.scrollTo(0,0);}
  if(act==="reset"){if(!confirm("Ștergi răspunsurile din această lecție? Cel mai bun scor, XP-ul și insignele rămân."))return;const st=ms(cur.mid);resetLesson(st);save(true);cur.view="intro";render("up");}
  if(act==="gameover"){cur.view="over";render("up");window.scrollTo(0,0);}
  if(act==="restart"){const st=ms(cur.mid);resetLesson(st);save(true);track("start",cur.mid);goCard(0);}
  if(act==="export"){const code=btoa(unescape(encodeURIComponent(JSON.stringify(Object.assign({},S,{deviceId:undefined})))));
    $("#xfer").innerHTML=`<label class="fld"><span>Codul tău de transfer</span><textarea readonly rows="4">${code}</textarea></label>`;$("#xfer textarea").select();
    if(navigator.clipboard)navigator.clipboard.writeText(code).then(()=>toast("Codul a fost copiat")).catch(()=>{});}
  if(act==="import"){$("#xfer").innerHTML=`<label class="fld"><span>Lipește codul de transfer</span><textarea rows="4" id="imp"></textarea></label><button class="btn" data-act="doimport">Încarcă progresul</button>`;}
  if(act==="doimport"){try{const o=JSON.parse(decodeURIComponent(escape(atob($("#imp").value.trim()))));if(!o||!o.mods)throw 0;
      if(!confirm("Progresul de pe acest dispozitiv va fi înlocuit. Continui?"))return;const id=S.deviceId;S=Object.assign(blank(),o.v===2?o:{mods:o.mods});S.v=2;S.deviceId=id;save(true);route();toast("Progres încărcat");}
    catch(err){$("#xfer").insertAdjacentHTML("beforeend",`<p class="err" role="alert">Codul nu este valid. Copiază-l din nou, complet.</p>`);}}
  if(act==="resetall"){if(!confirm("Ștergi tot progresul, XP-ul și insignele de pe acest dispozitiv?"))return;const id=S.deviceId;S=blank();S.deviceId=id;save(true);route();}
});
document.addEventListener("keydown",e=>{if(cur.view!=="card"||e.target.matches("input,select,textarea"))return;if(e.key==="Enter"){const b=$('[data-act="check"]:not([disabled])')||$('[data-act="next"]')||$('[data-act="finish"]');if(b){e.preventDefault();b.click();}}});
window.addEventListener("hashchange",route);

/* ===== EVENIMENTE PE MODUL (Google Sheets) ===== */
function track(ev,mid,extra){
  if(!COUNTER_URL||!S.deviceId)return;
  const body=JSON.stringify(Object.assign({type:"event",event:ev,module:mid,deviceId:S.deviceId},extra||{}));
  try{fetch(COUNTER_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body}).catch(()=>{});}catch(e){}
}
/* ===== CONTOR (Google Sheets) ===== */
function countVisit(){
  let isNew=false;if(!S.deviceId){S.deviceId=(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random().toString(16).slice(2));isNew=true;save(true);}
  if(!COUNTER_URL)return;
  try{if(sessionStorage.getItem("mo-counted"))return;sessionStorage.setItem("mo-counted","1");}catch(e){}
  const body=JSON.stringify({deviceId:S.deviceId,newDevice:isNew,device:/Mobi|Android|iPhone/i.test(navigator.userAgent)?"mobil":"desktop"});
  fetch(COUNTER_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body}).catch(()=>{});
}
countVisit();route();
</script>
</body>
